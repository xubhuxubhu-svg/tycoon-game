<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>霓虹冰球．十關挑戰</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#07070f;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,24,50,.82),rgba(5,5,12,.94));z-index:10;transition:opacity .3s}
.ov.hide{opacity:0;pointer-events:none}
.card{width:min(92vw,420px);padding:26px 22px;border-radius:20px;background:linear-gradient(160deg,rgba(30,40,70,.9),rgba(14,16,32,.95));border:1px solid rgba(120,170,255,.25);box-shadow:0 0 40px rgba(60,120,255,.25),inset 0 0 30px rgba(80,120,255,.08);text-align:center}
h1{font-size:34px;letter-spacing:4px;background:linear-gradient(90deg,#ff4d7a,#fff,#4d9dff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(140,160,255,.5));margin-bottom:4px}
.sub{color:#9fb3d9;font-size:13px;margin-bottom:18px}
.lbl{font-size:14px;color:#c7d4f0;margin:14px 0 8px;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:70px;padding:10px 6px;border-radius:12px;border:1px solid rgba(140,170,255,.25);background:rgba(255,255,255,.04);color:#dfe8ff;font-size:15px;cursor:pointer;transition:.15s}
.opt.on{background:linear-gradient(135deg,#ff3d6e,#7a4dff);border-color:transparent;box-shadow:0 0 14px rgba(255,61,110,.5);color:#fff}
.go{margin-top:22px;width:100%;padding:14px;border:none;border-radius:14px;font-size:20px;font-weight:bold;letter-spacing:6px;color:#fff;background:linear-gradient(90deg,#ff3d6e,#3d7bff);box-shadow:0 0 22px rgba(255,80,140,.45);cursor:pointer}
.go:active{transform:scale(.97)}
.tip{margin-top:14px;font-size:12px;line-height:1.7;color:#8ea0c4;text-align:left}
#hudBtns{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
#hudBtns button{width:40px;height:40px;border-radius:12px;border:1px solid rgba(140,170,255,.25);background:rgba(20,26,48,.7);color:#cfe0ff;font-size:18px;cursor:pointer}
#endTitle{font-size:56px;font-weight:900;letter-spacing:10px;margin-bottom:6px}
#endScore{font-size:30px;font-weight:bold;letter-spacing:6px;margin-bottom:18px;color:#fff}
.btn2{margin-top:10px;width:100%;padding:12px;border-radius:14px;border:1px solid rgba(140,170,255,.3);background:rgba(255,255,255,.05);color:#dfe8ff;font-size:17px;cursor:pointer}
#endOv{background:transparent}
#endOv .card{background:rgba(10,12,26,.55);backdrop-filter:blur(2px)}
.credit{margin-top:14px;font-size:12px;color:#7d8bb0;letter-spacing:2px}
.lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 10px}
.lv{aspect-ratio:1/1.15;border-radius:12px;border:1px solid rgba(140,170,255,.3);background:linear-gradient(160deg,rgba(255,61,110,.25),rgba(61,123,255,.25));display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.lv:active{transform:scale(.94)}
.lv b{font-size:22px;text-shadow:0 0 8px rgba(255,255,255,.5)}
.lv i{font-style:normal;font-size:11px;color:#ffd84a;letter-spacing:-1px;margin-top:2px}
.lv.lock{background:rgba(255,255,255,.03);color:#56607a;cursor:default}
.lv.lock i{color:#56607a}
.lv.next{box-shadow:0 0 14px rgba(255,90,140,.6);border-color:#ff5a84}
#endStars{font-size:38px;letter-spacing:6px;margin:2px 0 6px;color:#ffd84a;text-shadow:0 0 14px #ffae00}
#endStars .off{color:#3a4260;text-shadow:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudBtns" style="display:none"><button id="bMute">🔊</button><button id="bMenu">☰</button></div>

<div class="ov" id="menu">
 <div class="card">
  <h1>霓虹冰球</h1>
  <div class="sub">十關挑戰．手機、電腦都能玩的立體桌上冰球</div>
  <button class="go" id="bCampaign">闖 關 模 式</button>
  <div class="lbl">雙人同機（幾分獲勝）</div>
  <div class="row" id="optWin">
   <div class="opt on" data-v="3">3 分</div>
   <div class="opt" data-v="5">5 分</div>
   <div class="opt" data-v="7">7 分</div>
  </div>
  <button class="btn2" id="b2P">雙人同機對戰</button>
  <button class="btn2" id="bExit" style="display:none">離開遊戲</button>
  <div class="tip">
   ● 你是<span style="color:#ff5a84">紅方</span>（下方），把白色圓餅打進上方的<span style="color:#6aa8ff">藍色球門</span>。<br>
   ● 電腦：移動滑鼠控制擊球器。手機：手指拖曳。<br>
   ● 雙人同機：手機上下各一人用手指；電腦上紅方用滑鼠、藍方用方向鍵。<br>
   ● 每關依失分多寡獲得一到三顆星，過關才會開啟下一關。
  </div>
  <div class="credit">遊戲製作：Eric Hu</div>
 </div>
</div>

<div class="ov hide" id="lvOv">
 <div class="card">
  <h1 style="font-size:28px">選擇關卡</h1>
  <div class="sub" id="lvStarTotal">總星數 0 / 30</div>
  <div class="lvGrid" id="lvGrid"></div>
  <button class="btn2" id="bLvBack">返回</button>
 </div>
</div>

<div class="ov hide" id="endOv">
 <div class="card">
  <div id="endLv" class="sub" style="margin-bottom:4px"></div>
  <div id="endTitle">勝利</div>
  <div id="endStars"></div>
  <div id="endScore">3 – 2</div>
  <button class="go" id="bNext">下一關</button>
  <button class="btn2" id="bAgain">再玩一次</button>
  <button class="btn2" id="bBack">選擇關卡</button>
 </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
// ===== 桌面尺寸（世界座標）=====
const HW=0.5,HL=0.9,GW=0.34,RW=0.075,RH=0.06;
const RP=0.042,RM=0.066,PH=0.016,MH=0.028;
const MAXP=4.6;let maxP=MAXP,fric=0.82;
// ===== 相機 =====
const CAM={x:0,y:1.55,h:2.55},TGT={x:0,y:0.06,h:0};
let F=1,OX=0,OY=0,fw,rt,up;
function norm(v){const l=Math.hypot(v[0],v[1],v[2]);return[v[0]/l,v[1]/l,v[2]/l]}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
fw=norm([TGT.x-CAM.x,TGT.y-CAM.y,TGT.h-CAM.h]);rt=norm(cross(fw,[0,0,1]));up=cross(rt,fw);
function P(x,y,h){const v=[x-CAM.x,y-CAM.y,(h||0)-CAM.h];const z=dot(v,fw);return{x:OX+F*dot(v,rt)/z,y:OY-F*dot(v,up)/z,z}}
function unproject(sx,sy){const a=(sx-OX)/F,b=-(sy-OY)/F;const d=[rt[0]*a+up[0]*b+fw[0],rt[1]*a+up[1]*b+fw[1],rt[2]*a+up[2]*b+fw[2]];const t=-CAM.h/d[2];return{x:CAM.x+t*d[0],y:CAM.y+t*d[1]}}
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 F=1;OX=0;OY=0;let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
 for(const[x,y,h]of[[-HW-RW,-HL-RW,RH],[HW+RW,-HL-RW,RH],[-HW-RW,HL+RW,-0.05],[HW+RW,HL+RW,-0.05]]){const p=P(x,y,h);mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mny=Math.min(mny,p.y);mxy=Math.max(mxy,p.y)}
 const top=64,pad=16;F=Math.min((W-pad*2)/(mxx-mnx),(H-top-pad*2)/(mxy-mny));
 OX=W/2-F*(mnx+mxx)/2;OY=top+pad+(H-top-pad*2)/2-F*(mny+mxy)/2;}
addEventListener('resize',resize);resize();

// ===== 音效 =====
let AC=null,muted=false,master;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination)}catch(e){}}
function tone(f,dur,type,vol,f2,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02)}
let nbuf=null;function noise(dur,vol,freq,q,delay,type){if(!AC||muted)return;if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=nbuf;const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=freq;fl.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02)}
const SFX={
 hit(p){p=Math.min(1,p);noise(0.06,0.5*p+0.1,2400,1.2);tone(520+p*300,0.09,'triangle',0.35*p+0.08,180)},
 wall(p){p=Math.min(1,p);noise(0.04,0.25*p+0.05,3800,2);tone(900,0.05,'sine',0.12*p+0.03,500)},
 goal(good){noise(0.7,0.35,900,0.6,0,'lowpass');tone(110,0.5,'sawtooth',0.25,55);const n=good?[523,659,784,1047]:[392,330,262,196];n.forEach((f,i)=>{tone(f,0.22,'square',0.12,null,0.08+i*0.1);tone(f*2,0.22,'sine',0.06,null,0.08+i*0.1)})},
 beep(hi){tone(hi?1046:660,hi?0.35:0.15,'square',0.12);tone(hi?2092:1320,hi?0.35:0.15,'sine',0.05)},
 win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>{tone(f,0.3,'square',0.1,null,i*0.13);tone(f/2,0.3,'triangle',0.12,null,i*0.13)});noise(1.2,0.15,6000,0.5,0.5,'highpass')},
 lose(){[392,349,311,262].forEach((f,i)=>tone(f,0.4,'sawtooth',0.1,f*0.97,i*0.22))}
};

// ===== 遊戲狀態 =====
let mode='ai',winScore=3,curLv=0,LV=null;
const puck={x:0,y:0.2,vx:0,vy:0};
const red={x:0,y:HL-0.2,vx:0,vy:0,tx:0,ty:HL-0.2,r:RM};
const blue={x:0,y:-HL+0.2,vx:0,vy:0,tx:0,ty:-HL+0.2,r:RM};
let score=[0,0];// 紅, 藍
let state='menu',stateT=0,countN=0,lastScorer=-1,goalFlash=[0,0],shake=0,scorePulse=[0,0];
let trail=[],parts=[],rings=[],confetti=[],banner=null;
let aiT={x:0,y:0},aiReact=0;

function resetPositions(serveTo){
 red.x=red.tx=0;red.y=red.ty=HL-0.2;red.vx=red.vy=0;
 blue.x=blue.tx=0;blue.y=blue.ty=-HL+0.2;blue.vx=blue.vy=0;
 puck.vx=puck.vy=0;puck.x=0;puck.y=serveTo===1?-0.22:0.22;trail=[];
}
function startGame(){score=[0,0];resetPositions(0);state='count';stateT=0;countN=3;SFX.beep(false);
 document.getElementById('menu').classList.add('hide');document.getElementById('endOv').classList.add('hide');document.getElementById('hudBtns').style.display='flex';confetti=[];banner=null}

// ===== 輸入 =====
const touches={};let mouseOn=false;const keys={};
function setTarget(side,sx,sy){const w=unproject(sx,sy);const m=side===0?red:blue;m.tx=w.x;m.ty=w.y}
cv.addEventListener('mousemove',e=>{mouseOn=true;setTarget(0,e.clientX,e.clientY)});
cv.addEventListener('mousedown',e=>{mouseOn=true;setTarget(0,e.clientX,e.clientY)});
function tStart(e){e.preventDefault();for(const t of e.changedTouches){const w=unproject(t.clientX,t.clientY);let side=0;if(mode==='2p'&&w.y<0)side=1;touches[t.identifier]=side;setTarget(side,t.clientX,t.clientY)}}
function tMove(e){e.preventDefault();for(const t of e.changedTouches){const s=touches[t.identifier];if(s!==undefined)setTarget(s,t.clientX,t.clientY)}}
function tEnd(e){for(const t of e.changedTouches)delete touches[t.identifier]}
cv.addEventListener('touchstart',tStart,{passive:false});cv.addEventListener('touchmove',tMove,{passive:false});cv.addEventListener('touchend',tEnd);cv.addEventListener('touchcancel',tEnd);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>{keys[e.key]=false});

// ===== 特效 =====
function spark(x,y,n,col,spd,up){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*0.45*(0.3+Math.random());parts.push({x,y,h:0.02,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vh:(up||0.5)*Math.random()*0.6+0.1,life:0,max:0.15+Math.random()*0.25,col,size:0.006+Math.random()*0.008})}}
function ring(x,y,col,max){rings.push({x,y,r:0.02,life:0,max:max||0.35,col})}

// ===== 物理 =====
function moveMallet(m,minY,maxY,spd,dt){
 let tx=Math.max(-HW+m.r,Math.min(HW-m.r,m.tx)),ty=Math.max(minY,Math.min(maxY,m.ty));
 let dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy),mx=spd*dt;
 const ox=m.x,oy=m.y;if(d>mx){dx*=mx/d;dy*=mx/d}
 m.x+=dx;m.y+=dy;m.vx=(m.x-ox)/dt;m.vy=(m.y-oy)/dt;
}
let hitCool=0,wallCool=0;
function collide(m,dt){
 const dx=puck.x-m.x,dy=puck.y-m.y,d=Math.hypot(dx,dy),R=RP+m.r;
 if(d<R&&d>1e-6){const nx=dx/d,ny=dy/d;puck.x=m.x+nx*R;puck.y=m.y+ny*R;
  const rvx=puck.vx-m.vx,rvy=puck.vy-m.vy,vn=rvx*nx+rvy*ny;
  if(vn<0){const e=0.92;puck.vx-=(1+e)*vn*nx;puck.vy-=(1+e)*vn*ny;
   const sp=Math.hypot(puck.vx,puck.vy);if(sp>maxP){puck.vx*=maxP/sp;puck.vy*=maxP/sp}
   if(hitCool<=0){const p=Math.min(1,-vn/3.5);SFX.hit(p);const cx=m.x+nx*m.r,cy=m.y+ny*m.r;spark(cx,cy,6+p*16|0,p>0.5?'#fff3a0':'#ffffff',0.6+p*1.6);if(p>0.35){ring(cx,cy,m===red?'255,80,130':'90,150,255');shake=Math.max(shake,p*5)}hitCool=0.06}}}
}
function stepPhysics(dt){
 // 紅方（下）
 if(state==='play'||state==='count'){
  moveMallet(red,RM*0.6,HL-RM,9,dt);
  if(mode==='2p'){
   const kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ky=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
   if(kx||ky){blue.tx=blue.x-kx*0.12;blue.ty=blue.y+ky*0.12}// 畫面左右與世界座標相反
   moveMallet(blue,-HL+blue.r,-blue.r*0.6,mode==='2p'&&(kx||ky)?2.6:9,dt);
  }else if(mode==='net'){moveMallet(blue,-HL+blue.r,-blue.r*0.6,9,dt)}else{aiStep(dt);moveMallet(blue,-HL+blue.r,-blue.r*0.6,LV.spd,dt)}
 }
 if(state!=='play')return;
 const fr=Math.pow(fric,dt);puck.vx*=fr;puck.vy*=fr;
 puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;
 collide(red,dt);collide(blue,dt);
 // 側牆
 if(puck.x<-HW+RP){puck.x=-HW+RP;wallHit('x')}else if(puck.x>HW-RP){puck.x=HW-RP;wallHit('x')}
 // 底牆與球門
 const inMouth=Math.abs(puck.x)<GW/2-RP*0.4;
 if(puck.y<-HL+RP&&!inMouth){puck.y=-HL+RP;wallHit('y')}
 if(puck.y>HL-RP&&!inMouth){puck.y=HL-RP;wallHit('y')}
 for(const py of[-HL,HL])for(const px of[-GW/2,GW/2]){const dx=puck.x-px,dy=puck.y-py,d=Math.hypot(dx,dy);if(d<RP&&d>1e-6){const nx=dx/d,ny=dy/d;puck.x=px+nx*RP;puck.y=py+ny*RP;const vn=puck.vx*nx+puck.vy*ny;if(vn<0){puck.vx-=1.8*vn*nx;puck.vy-=1.8*vn*ny;SFX.wall(0.6)}}}
 if(puck.y<-HL-RP*1.2)goal(0);else if(puck.y>HL+RP*1.2)goal(1);
}
function wallHit(ax){const v=ax==='x'?puck.vx:puck.vy;if(ax==='x')puck.vx=-puck.vx*0.88;else puck.vy=-puck.vy*0.88;
 const p=Math.abs(v)/3;if(wallCool<=0&&p>0.05){SFX.wall(p);spark(puck.x,puck.y,4+p*8|0,'#bfe6ff',0.4+p);wallCool=0.05}}
function goal(who){// who: 0 紅得分, 1 藍得分
 state='goal';stateT=0;lastScorer=who;score[who]++;scorePulse[who]=1;
 goalFlash[who===0?1:0]=1;shake=14;
 const gy=who===0?-HL:HL,col=who===0?'#ff4d7a':'#4d9dff';
 spark(puck.x,gy,60,col,2.4,1.6);spark(puck.x,gy,30,'#ffffff',1.6,1.2);ring(puck.x,gy,who===0?'255,80,130':'90,150,255',0.6);
 SFX.goal(mode==='2p'||who===0);
 banner={text:(mode!=='2p'&&who===1)?'失分！':'得分！',col,t:0};
 puck.vx=puck.vy=0;puck.y=gy+(who===0?-0.2:0.2);
}

// ===== 電腦 =====
function aiStep(dt){
 aiReact-=dt;const err=LV.err;
 if(aiReact<=0){aiReact=LV.react;
  let tx,ty;const home=-HL+0.17;
  if(puck.y<0.02){// 球在電腦半場
   const slowish=Math.hypot(puck.vx,puck.vy)<2.2||puck.vy>0;
   if(blue.y>puck.y-0.02){// 擋在球前面 → 繞到後面
    tx=puck.x+(puck.x>blue.x?-1:1)*0.14;ty=puck.y-0.14;
    if(puck.vy<-0.5){tx=puck.x;ty=Math.min(home,puck.y-0.1)}
   }else if(slowish||puck.y<-HL*0.4){
    const ax=(Math.random()-0.5)*0.3,ay=HL;let dx=ax-puck.x,dy=ay-puck.y,dl=Math.hypot(dx,dy);dx/=dl;dy/=dl;
    tx=puck.x-dx*(RP+blue.r)*0.5;ty=puck.y-dy*(RP+blue.r)*0.5;
   }else{tx=puck.x;ty=Math.min(home,puck.y-0.15)}
  }else{// 防守：預測球的橫向位置
   let px=puck.x;if(puck.vy<-0.1){const t=(puck.y-home)/(-puck.vy);px=puck.x+puck.vx*t;while(px>HW||px<-HW){if(px>HW)px=2*HW-px;if(px<-HW)px=-2*HW-px}}
   tx=Math.max(-GW*0.75,Math.min(GW*0.75,px*0.7));ty=home;
  }
  aiT.x=tx+(Math.random()-0.5)*err*2;aiT.y=ty+(Math.random()-0.5)*err;
 }
 blue.tx=aiT.x;blue.ty=aiT.y;
}

// ===== 繪圖 =====
function quad(pts,fill){ctx.beginPath();pts.forEach((q,i)=>{const p=P(q[0],q[1],q[2]);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function ell(x,y,h,r){const a=P(x,y-r,h),b=P(x,y+r,h),c=P(x,y,h);return{cx:c.x,cy:(a.y+b.y)/2,rx:F*r/c.z,ry:Math.abs(b.y-a.y)/2}}
function fillEll(e,f){ctx.beginPath();ctx.ellipse(e.cx,e.cy,Math.max(.1,e.rx),Math.max(.1,e.ry),0,0,Math.PI*2);ctx.fillStyle=f;ctx.fill()}
function cyl(x,y,h0,h1,r,side,top){const b=ell(x,y,h0,r),t=ell(x,y,h1,r);fillEll(b,side);ctx.fillStyle=side;ctx.fillRect(t.cx-t.rx,t.cy,t.rx*2,b.cy-t.cy);fillEll(t,top);return t}
function lineW(a,b,col,w){const p=P(a[0],a[1],a[2]||0),q=P(b[0],b[1],b[2]||0);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}
function glowEll(x,y,r,col,a,squash){const c=P(x,y,0),e=ell(x,y,0,r);ctx.save();ctx.translate(c.x,c.y);ctx.scale(1,(e.ry/e.rx)*(squash||1));const g=ctx.createRadialGradient(0,0,0,0,0,e.rx);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,e.rx,0,Math.PI*2);ctx.fill();ctx.restore()}

function drawTable(t){
 // 桌腳陰影
 const sh=P(0,0.1,-0.3);ctx.save();ctx.translate(sh.x,sh.y+20);ctx.scale(1,0.35);const sg=ctx.createRadialGradient(0,0,0,0,0,F*0.9);sg.addColorStop(0,'rgba(0,0,0,.6)');sg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,F*0.9,0,7);ctx.fill();ctx.restore();
 // 外框底座
 quad([[-HW-RW,HL+RW,RH],[HW+RW,HL+RW,RH],[HW+RW,HL+RW,-0.06],[-HW-RW,HL+RW,-0.06]],'#2b3a48');
 // 桌面
 const a=P(0,-HL,0),b=P(0,HL,0);const g=ctx.createLinearGradient(0,a.y,0,b.y);g.addColorStop(0,'#1d2f48');g.addColorStop(0.5,'#1a2539');g.addColorStop(1,'#1c2236');
 quad([[-HW,-HL,0],[HW,-HL,0],[HW,HL,0],[-HW,HL,0]],g);
 // 球門燈光照在桌面
 glowEll(0,-HL,0.42,'80,110,255',0.35+goalFlash[1]*0.5,1.1);
 glowEll(0,HL,0.42,'255,50,80',0.25+goalFlash[0]*0.5,1.1);
 // 細格紋
 ctx.globalAlpha=0.05;for(let i=-4;i<=4;i++)lineW([i*HW/4.5,-HL],[i*HW/4.5,HL],'#9cf',1);for(let j=-9;j<=9;j++)lineW([-HW,j*HL/9.5],[HW,j*HL/9.5],'#9cf',1);ctx.globalAlpha=1;
 // 中線
 ctx.save();ctx.shadowColor='#5ff';ctx.shadowBlur=8;lineW([-HW,0],[HW,0],'rgba(200,240,255,.85)',1.6);ctx.restore();
 for(const sx of[-HW,HW]){const p=P(sx,0,0.002);const gg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,14);gg.addColorStop(0,'rgba(120,255,255,.95)');gg.addColorStop(1,'rgba(120,255,255,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(p.x,p.y,14,0,7);ctx.fill()}
 // 中圈
 ctx.beginPath();for(let i=0;i<=48;i++){const an=i/48*Math.PI*2,p=P(Math.cos(an)*0.13,Math.sin(an)*0.13,0);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.strokeStyle='rgba(235,245,255,.9)';ctx.lineWidth=1.8;ctx.stroke();
 for(const dy of[-0.33,0.33]){fillEll(ell(0,dy,0,0.012),'rgba(200,215,235,.6)')}
 // 遠端球門
 drawGoal(-1,t);
 // 遠端擋板
 const steel='#3e5263',steelTop='#5d7488',inner='#2a3846';
 for(const s of[[-HW-RW,-GW/2],[GW/2,HW+RW]]){
  quad([[s[0],-HL-RW,RH],[s[1],-HL-RW,RH],[s[1],-HL,RH],[s[0],-HL,RH]],steelTop);
  quad([[Math.max(s[0],-HW),-HL,RH],[Math.min(s[1],HW),-HL,RH],[Math.min(s[1],HW),-HL,0],[Math.max(s[0],-HW),-HL,0]],inner);
 }
 // 兩側擋板
 for(const sd of[-1,1]){
  const xi=sd*HW,xo=sd*(HW+RW);
  quad([[xi,-HL,0],[xi,HL,0],[xi,HL,RH],[xi,-HL,RH]],sd<0?'#2c3b4a':'#2c3b4a');
  const sg2=ctx.createLinearGradient(P(xi,0,RH).x,0,P(xo,0,RH).x,0);sg2.addColorStop(0,'#7a90a5');sg2.addColorStop(0.3,steelTop);sg2.addColorStop(1,'#3a4d5e');
  quad([[xi,-HL-RW,RH],[xi,HL+RW,RH],[xo,HL+RW,RH],[xo,-HL-RW,RH]],sg2);
  lineW([xi,-HL,RH],[xi,HL,RH],'rgba(180,220,255,.35)',1);
 }
}
function drawNearRail(t){
 const steelTop='#5d7488';
 drawGoal(1,t);
 for(const s of[[-HW-RW,-GW/2],[GW/2,HW+RW]]){
  quad([[s[0],HL,RH],[s[1],HL,RH],[s[1],HL+RW,RH],[s[0],HL+RW,RH]],steelTop);
  quad([[s[0],HL+RW,RH],[s[1],HL+RW,RH],[s[1],HL+RW,-0.06],[s[0],HL+RW,-0.06]],'#33475a');
  lineW([s[0],HL,RH],[s[1],HL,RH],'rgba(180,220,255,.35)',1);
 }
 // 角落螺栓
 for(const[x,y]of[[-HW-RW/2,HL+RW/2],[HW+RW/2,HL+RW/2],[-HW-RW/2,-HL-RW/2],[HW+RW/2,-HL-RW/2]]){const e=ell(x,y,RH,0.022);fillEll(e,'#1a2430');fillEll({cx:e.cx,cy:e.cy-1,rx:e.rx*0.6,ry:e.ry*0.6},'#4a5c6c')}
}
function drawGoal(sd,t){// sd -1 遠端(藍) 1 近端(紅)
 const y0=sd*HL,y1=sd*(HL+RW),col=sd<0?'90,120,255':'255,50,80',fl=goalFlash[sd<0?1:0];
 const pulse=0.75+0.25*Math.sin(t*4);
 quad([[-GW/2,y0,0],[GW/2,y0,0],[GW/2,y1,0],[-GW/2,y1,0]],'#05060c');
 ctx.save();ctx.shadowColor=`rgb(${col})`;ctx.shadowBlur=24+fl*40;
 quad([[-GW/2,y1,RH*0.9],[GW/2,y1,RH*0.9],[GW/2,y1+sd*0.012,RH*0.9],[-GW/2,y1+sd*0.012,RH*0.9]],`rgba(${col},${0.85*pulse+fl*0.15})`);
 quad([[-GW/2,y1,0],[GW/2,y1,0],[GW/2,y1,RH*0.9],[-GW/2,y1,RH*0.9]],`rgba(${col},${0.35+fl*0.6})`);
 if(sd>0){quad([[-GW/2,y1+0.012,-0.02],[GW/2,y1+0.012,-0.02],[GW/2,y1+0.03,-0.02],[-GW/2,y1+0.03,-0.02]],`rgba(${col},.9)`)}
 ctx.restore();
 // 光柱
 const c=P(0,y1,RH),top=P(0,y1,RH+0.35+fl*0.3);const lg=ctx.createLinearGradient(0,c.y,0,top.y);lg.addColorStop(0,`rgba(${col},${0.35+fl*0.5})`);lg.addColorStop(1,`rgba(${col},0)`);
 const hw=F*GW/2/c.z;ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(c.x-hw,c.y);ctx.lineTo(c.x+hw,c.y);ctx.lineTo(c.x+hw*0.6,top.y);ctx.lineTo(c.x-hw*0.6,top.y);ctx.fill();
}
function drawMallet(m,base,dark,light){
 fillEll(ell(m.x+0.008,m.y+0.012,0,m.r*1.05),'rgba(0,0,0,.45)');
 const ge=ell(m.x,m.y,0,m.r*1.8);ctx.save();ctx.globalCompositeOperation='lighter';const gg=ctx.createRadialGradient(ge.cx,ge.cy,0,ge.cx,ge.cy,ge.rx);gg.addColorStop(0,base.replace('rgb','rgba').replace(')',',.22)'));gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.ellipse(ge.cx,ge.cy,ge.rx,ge.ry,0,0,7);ctx.fill();ctx.restore();
 const t=cyl(m.x,m.y,0,MH,m.r,dark,base);
 const tg=ctx.createRadialGradient(t.cx-t.rx*0.3,t.cy-t.ry*0.4,0,t.cx,t.cy,t.rx);tg.addColorStop(0,light);tg.addColorStop(1,base);fillEll(t,tg);
 fillEll({cx:t.cx,cy:t.cy,rx:t.rx*0.62,ry:t.ry*0.62},dark);
 const k=cyl(m.x,m.y,MH,MH+0.035,m.r*0.4,dark,base);
 const kg=ctx.createRadialGradient(k.cx-k.rx*0.3,k.cy-k.ry*0.3,0,k.cx,k.cy,k.rx);kg.addColorStop(0,'#fff');kg.addColorStop(0.35,light);kg.addColorStop(1,base);fillEll(k,kg);
}
function drawPuck(){
 // 拖影
 for(let i=0;i<trail.length;i++){const tr=trail[i],a=(i+1)/trail.length;const e=ell(tr.x,tr.y,PH,RP*(0.55+0.45*a));ctx.globalAlpha=a*0.32;fillEll(e,'#e8f4ff')}ctx.globalAlpha=1;
 fillEll(ell(puck.x+0.006,puck.y+0.01,0,RP*1.05),'rgba(0,0,0,.5)');
 const sp=Math.hypot(puck.vx,puck.vy);if(sp>1.2){ctx.save();ctx.globalCompositeOperation='lighter';glowEll(puck.x,puck.y,RP*2.6,'200,230,255',Math.min(.5,(sp-1.2)/5));ctx.restore()}
 const t=cyl(puck.x,puck.y,0,PH,RP,'#b9c3cf','#f4f8ff');
 const g=ctx.createRadialGradient(t.cx-t.rx*0.3,t.cy-t.ry*0.3,0,t.cx,t.cy,t.rx);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#d7e0ea');fillEll(t,g);
}
function drawParts(dt){
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life+=dt;const k=r.life/r.max;if(k>=1){rings.splice(i,1);continue}const e=ell(r.x,r.y,0.003,0.03+k*0.22);ctx.beginPath();ctx.ellipse(e.cx,e.cy,e.rx,e.ry,0,0,7);ctx.strokeStyle=`rgba(${r.col},${1-k})`;ctx.lineWidth=3*(1-k)+0.5;ctx.stroke()}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue}
  const ox=p.x,oy=p.y,oh=p.h;p.x+=p.vx*dt;p.y+=p.vy*dt;p.h+=p.vh*dt;p.vh-=3*dt;if(p.h<0){p.h=0;p.vh*=-0.4}p.vx*=0.97;p.vy*=0.97;
  const a=P(ox,oy,oh),b=P(p.x,p.y,p.h),k=1-p.life/p.max;ctx.strokeStyle=p.col;ctx.globalAlpha=k;ctx.lineWidth=Math.max(1,F*p.size/b.z);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x+(b.x-a.x)*1.5,b.y+(b.y-a.y)*1.5);ctx.stroke()}
 ctx.restore();ctx.globalAlpha=1;
}
function drawHUD(t){
 const cx=W/2,w=112,h=38,y=12;
 if(LV&&state!=='menu'){ctx.save();ctx.font='bold 14px "PingFang TC","Microsoft JhengHei",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='rgba(20,26,48,.7)';rr(10,12,78,38,10);ctx.fill();ctx.fillStyle='#ffd84a';ctx.fillText('第 '+(curLv+1)+' 關',22,31);ctx.restore()}
 ctx.fillStyle='rgba(18,22,40,.85)';ctx.strokeStyle='rgba(120,150,220,.25)';ctx.lineWidth=1;rr(cx-w/2,y,w,h,8);ctx.fill();ctx.stroke();
 ctx.font='bold 22px "Courier New",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
 const s0=1+scorePulse[0]*0.6,s1=1+scorePulse[1]*0.6;
 ctx.save();ctx.translate(cx-28,y+h/2+1);ctx.scale(s0,s0);ctx.shadowColor='#ff2050';ctx.shadowBlur=10+scorePulse[0]*20;ctx.fillStyle='#ff3a5c';ctx.fillText(score[0],0,0);ctx.restore();
 ctx.fillStyle='rgba(180,190,220,.5)';ctx.fillText('·',cx,y+h/2);
 ctx.save();ctx.translate(cx+28,y+h/2+1);ctx.scale(s1,s1);ctx.shadowColor='#3060ff';ctx.shadowBlur=10+scorePulse[1]*20;ctx.fillStyle='#4a7dff';ctx.fillText(score[1],0,0);ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function bigText(txt,col,k,size){ctx.save();ctx.translate(W/2,H*0.5);const s=k<0.2?0.4+k/0.2*0.8:(k<0.3?1.2-(k-0.2)*2:1);ctx.scale(s,s);ctx.globalAlpha=k>0.8?(1-k)/0.2:1;ctx.font=`900 ${size}px "PingFang TC","Microsoft JhengHei",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=col;ctx.shadowBlur=30;ctx.fillStyle=col;ctx.fillText(txt,0,0);ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText(txt,0,-2);ctx.restore()}

let last=performance.now(),acc=0,T=0;
function frame(now){
 let dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
 if(state!=='menu'&&state!=='paused'){
  if(mode==='netg')netGuestStep(dt);else{acc+=dt;const st=1/240;while(acc>=st){hitCool-=st;wallCool-=st;stepPhysics(st);acc-=st}}if(mode==='net'||mode==='netg')netSend(dt);
  stateT+=dt;
  if(state==='count'){const n=3-Math.floor(stateT/0.7);if(n!==countN){countN=n;if(n>0)SFX.beep(false);else SFX.beep(true)}if(stateT>=2.1+0.5){state='play';stateT=0}}
  else if(state==='goal'&&stateT>1.5&&mode!=='netg'){
   if(score[lastScorer]>=winScore){endGame()}else{resetPositions(lastScorer===0?1:0);state='play';stateT=0;SFX.beep(true)}
  }
  const sp=Math.hypot(puck.vx,puck.vy);if(state==='play'&&sp>0.4){trail.push({x:puck.x,y:puck.y});if(trail.length>10)trail.shift()}else if(trail.length)trail.shift();
 }
 goalFlash[0]=Math.max(0,goalFlash[0]-dt*0.8);goalFlash[1]=Math.max(0,goalFlash[1]-dt*0.8);
 scorePulse[0]=Math.max(0,scorePulse[0]-dt*1.5);scorePulse[1]=Math.max(0,scorePulse[1]-dt*1.5);
 shake=Math.max(0,shake-dt*40);
 render(dt);requestAnimationFrame(frame);
}
function render(dt){
 const bg=ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,Math.max(W,H)*0.75);bg.addColorStop(0,'#161a30');bg.addColorStop(1,'#06060d');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.save();if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
 drawTable(T);
 const objs=[{y:blue.y,d:()=>drawMallet(blue,'rgb(60,125,215)','#1f4a8a','#9cc8ff')},{y:red.y,d:()=>drawMallet(red,'rgb(226,40,90)','#8a1636','#ff9ab4')},{y:puck.y,d:()=>{if(state!=='goal'&&state!=='over')drawPuck()}}];
 objs.sort((a,b)=>a.y-b.y);
 drawParts(dt);
 for(const o of objs)if(o.y<=HL+0.02)o.d();
 drawNearRail(T);
 for(const o of objs)if(o.y>HL+0.02)o.d();
 ctx.restore();
 drawHUD(T);
 if(state==='count'&&LV){ctx.save();ctx.textAlign='center';ctx.font='bold 26px "PingFang TC","Microsoft JhengHei",sans-serif';ctx.shadowColor='#ff4d7a';ctx.shadowBlur=16;ctx.fillStyle='#fff';ctx.fillText('第 '+(curLv+1)+' 關．'+LV.name,W/2,H*0.32);ctx.shadowBlur=0;ctx.font='16px "PingFang TC","Microsoft JhengHei",sans-serif';ctx.fillStyle='#ffd84a';ctx.fillText(LV.desc,W/2,H*0.32+30);ctx.font='14px "PingFang TC","Microsoft JhengHei",sans-serif';ctx.fillStyle='#9fb3d9';ctx.fillText('先得 '+LV.win+' 分獲勝',W/2,H*0.32+54);ctx.restore()}
 if(state==='count'){const n=3-Math.floor(stateT/0.7);const k=(stateT%0.7)/0.7;bigText(n>0?String(n):'開始！',n>0?'#7ecbff':'#ffd84a',Math.min(k,0.79),n>0?110:80)}
 if(banner){banner.t+=dt;const k=banner.t/1.4;if(k>=1)banner=null;else bigText(banner.text,banner.col,k,72)}
 // 勝利金色碎片
 if(confetti.length){ctx.save();ctx.globalCompositeOperation='lighter';for(const c of confetti){c.y+=c.vy*dt;c.x+=Math.sin(T*2+c.p)*20*dt;if(c.y>H+10){c.y=-10;c.x=Math.random()*W}ctx.globalAlpha=0.5+0.5*Math.sin(T*6+c.p);ctx.fillStyle=c.c;ctx.beginPath();ctx.arc(c.x,c.y,c.s,0,7);ctx.fill()}ctx.restore();ctx.globalAlpha=1}
}

 document.getElementById('lvStarTotal').textContent='總星數 '+tot+' / 30';}
function startLevel(i){initAudio();if(AC&&AC.state==='suspended')AC.resume();
 mode='ai';curLv=i;LV=LEVELS[i];winScore=LV.win;maxP=MAXP*LV.maxp;fric=LV.fric;blue.r=RM*LV.ar;aiReact=0;show(null);startGame();tellHost('levelStart',{level:i+1})}
let win2p=3;
function start2P(){initAudio();if(AC&&AC.state==='suspended')AC.resume();mode='2p';LV=null;winScore=win2p;maxP=MAXP;fric=0.82;blue.r=RM;show(null);startGame()}
function endGame(){state='over';
 const redWon=score[0]>score[1];const et=document.getElementById('endTitle'),es=document.getElementById('endStars'),el=document.getElementById('endLv');
 const bN=document.getElementById('bNext'),bB=document.getElementById('bBack');
 bN.style.display='none';
 if(mode==='ai'){
  el.textContent='第 '+(curLv+1)+' 關．'+LV.name;bB.textContent='選擇關卡';
  if(redWon){const c=score[1];const stars=c===0?3:(c<=Math.ceil(LV.win/2)-1?2:1);
   prog.stars[curLv]=Math.max(prog.stars[curLv]||0,stars);if(curLv+1<10)prog.unlocked=Math.max(prog.unlocked,curLv+2);saveProg();
   es.innerHTML='★'.repeat(stars)+'<span class="off">'+'★'.repeat(3-stars)+'</span>';es.style.display='';
   if(curLv===9){et.textContent='全部通關';SFX.win();setTimeout(()=>SFX.win(),1100);tellHost('allClear',{totalStars:prog.stars.reduce((a,b)=>a+b,0)})}
   else{et.textContent='過關';bN.style.display='';SFX.win()}
   et.style.color='#ffd84a';et.style.textShadow='0 0 24px #ffb000,0 0 4px #fff';
   tellHost('levelWin',{level:curLv+1,stars,score:[score[0],score[1]]});
  }else{et.textContent='挑戰失敗';es.style.display='none';et.style.color='#8fa0c0';et.style.textShadow='0 0 14px #3050a0';SFX.lose();tellHost('levelLose',{level:curLv+1,score:[score[0],score[1]]})}
 }else if(mode==='net'||mode==='netg'){el.textContent='連線對戰';es.style.display='none';et.textContent=redWon?'你贏了！':'對手獲勝';et.style.color=redWon?'#ffd84a':'#8fa0c0';et.style.textShadow='0 0 24px currentColor';redWon?SFX.win():SFX.lose();document.getElementById('bAgain').style.display='none';bB.style.display='none';tellHost('netOver',{score:[score[0],score[1]],win:redWon})
 }else{el.textContent='雙人同機';es.style.display='none';bB.textContent='回主選單';
  et.textContent=redWon?'紅方勝利':'藍方勝利';et.style.color=redWon?'#ff5a84':'#6aa8ff';et.style.textShadow='0 0 24px currentColor';SFX.win()}
 et.style.fontSize=et.textContent.length>2?'44px':'60px';
 document.getElementById('endScore').textContent=score[0]+' – '+score[1];
 if(redWon||mode==='2p'){confetti=[];for(let i=0;i<70;i++)confetti.push({x:Math.random()*W,y:Math.random()*H,vy:30+Math.random()*60,s:1+Math.random()*2.5,p:Math.random()*6,c:Math.random()<0.7?'#ffd23a':'#fff6c0'})}
 show('endOv');document.getElementById('hudBtns').style.display='none';
}

// ===== 選單 =====
function group(id,cb){const g=document.getElementById(id);g.addEventListener('click',e=>{const o=e.target.closest('.opt');if(!o)return;g.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));o.classList.add('on');cb(o.dataset.v)})}
group('optWin',v=>win2p=+v);
document.getElementById('bCampaign').onclick=()=>{initAudio();toLevels()};
document.getElementById('b2P').onclick=start2P;
document.getElementById('bLvBack').onclick=toMenu;
document.getElementById('bNext').onclick=()=>startLevel(curLv+1);
document.getElementById('bAgain').onclick=()=>mode==='ai'?startLevel(curLv):start2P();
document.getElementById('bBack').onclick=()=>mode==='ai'?toLevels():toMenu();
document.getElementById('bMenu').onclick=()=>mode==='ai'?toLevels():toMenu();
if(EMBED){const bx=document.getElementById('bExit');bx.style.display='';bx.onclick=()=>tellHost('exit')}
// 外層遊戲可用訊息控制：{type:'neonHockey',cmd:'startLevel',level:1~10} / {cmd:'menu'} / {cmd:'mute',value:true}
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='neonHockey'||!d.cmd)return;
 if(d.cmd==='startLevel'){const i=Math.max(0,Math.min(9,(d.level|0)-1));startLevel(i)}
 else if(d.cmd==='menu')toMenu();else if(d.cmd==='levels')toLevels();
 else if(d.cmd==='netStart'){netStart(d.role,d.win)}
 else if(d.cmd==='netData'){netApply(d.d)}
 else if(d.cmd==='mute'){muted=!!d.value;document.getElementById('bMute').textContent=muted?'🔇':'🔊'}
 else if(d.cmd==='resetProgress'){prog={unlocked:1,stars:Array(10).fill(0)};saveProg();buildGrid()}});

// ===== 不同裝置連線對戰（由外層「製作大亨」轉送資料） =====
// 房主：跑完整物理、自己是紅方（下）；對手：只畫面＋自己的擊球器，畫面上下翻轉，所以自己也在下方
let netAcc=0,netPrev='';const NST=['menu','count','play','goal','over','paused'];
function netStart(role,win){initAudio();if(AC&&AC.state==='suspended')AC.resume();mode=role==='host'?'net':'netg';LV=null;winScore=win||5;maxP=MAXP;fric=0.82;blue.r=RM;show(null);startGame();document.getElementById('hudBtns').style.display='none';netPrev='count'}
function netSend(dt){netAcc+=dt;if(netAcc<1/30)return;netAcc=0;
 if(mode==='net')tellHost('net',{d:[+puck.x.toFixed(4),+puck.y.toFixed(4),+puck.vx.toFixed(3),+puck.vy.toFixed(3),+red.x.toFixed(4),+red.y.toFixed(4),+blue.x.toFixed(4),+blue.y.toFixed(4),score[0],score[1],NST.indexOf(state),+stateT.toFixed(2),lastScorer]});
 else tellHost('net',{d:[+(-red.tx).toFixed(4),+(-red.ty).toFixed(4)]})}
function netGuestStep(dt){moveMallet(red,RM*0.6,HL-RM,9,dt);if(state!=='play')return;
 puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;const lx=HW-RP;if(puck.x<-lx){puck.x=-lx;puck.vx=Math.abs(puck.vx)}if(puck.x>lx){puck.x=lx;puck.vx=-Math.abs(puck.vx)}}
function netApply(d){
 if(mode==='net'){blue.tx=d[0];blue.ty=d[1];return}
 if(mode!=='netg')return;const ns=NST[d[10]]||'play';
 puck.x=-d[0];puck.y=-d[1];puck.vx=-d[2];puck.vy=-d[3];
 const bx=-d[4],by=-d[5];blue.vx=(bx-blue.x)*30;blue.vy=(by-blue.y)*30;blue.x=bx;blue.y=by;
 const gx=-d[6],gy=-d[7];if(Math.hypot(gx-red.x,gy-red.y)>0.3){red.x=gx;red.y=gy}
 if(ns==='goal'&&state!=='goal'){goal(d[12]===0?1:0)}
 score=[d[9],d[8]];
 if(ns==='play'&&state!=='play'){if(state==='goal'){SFX.beep(true);trail=[]}state='play';stateT=0}
 if(ns==='count'&&state!=='count'){state='count';stateT=d[11]}
 if(ns==='over'&&state!=='over'){endGame()}
}
tellHost('ready',{levels:10});
document.getElementById('bMute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};
resetPositions(0);requestAnimationFrame(frame);
})();
</script>
