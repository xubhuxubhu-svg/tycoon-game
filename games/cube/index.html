#bubble.on{transform:translate(-50%,-100%) scale(1)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:#333;border-bottom:0}
.float{position:fixed;transform:translate(-50%,-50%);font-weight:700;font-size:40px;color:#ffe44d;-webkit-text-stroke:2px #8a3b00;paint-order:stroke fill;text-shadow:0 3px 0 #8a3b00;pointer-events:none;animation:rise 1.2s ease-out forwards;z-index:4;white-space:nowrap}
.float.big{font-size:58px;color:#fff36b}

@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

<canvas id="c"></canvas>
<div id="hud">

  <div id="score">0</div>
  <div id="lvl">第 1 關</div><div id="goals"></div><div id="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#fff"/></svg></div>

<script>
(function(){
if(!window.THREE){document.getElementById('loading').textContent='載入失敗，請重新整理';return;}
document.getElementById('loading').remove();
const $=id=>document.getElementById(id);
const N=8, CELL=1, CUBE=0.92, BOARD_TOP=0.35, CY=BOARD_TOP+CUBE/2, LIFT=1.15;
const METER_MAX=40;
const COLORS={yellow:'#ffd629',green:'#3fd873',blue:'#36aef2',pink:'#f23a8a',orange:'#ff8326',purple:'#9a55ee',red:'#ef3434',stone:'#9ea4ad'};
const CKEYS=Object.keys(COLORS).filter(k=>k!=='stone');
const WHITE=new THREE.Color('#ffffff');
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:+v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------------- 音效 ---------------- */
let AC=null,master=null,muted=store.get('cube_mute',0)===1,noiseBuf=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){return null}}
  if(AC.state==='suspended')AC.resume();return AC;
}
function env(g,t,a,dur,vol){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
function tone(o){if(muted||!ac())return;const t=AC.currentTime+(o.delay||0);const os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'sine';
  os.frequency.setValueAtTime(o.f0,t);if(o.f1)os.frequency.exponentialRampToValueAtTime(o.f1,t+(o.slide||o.dur));
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=o.vibAmt||20;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+o.dur+.05);}
  let node=os;if(o.bp){const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=o.bp;f.Q.value=o.q||2;os.connect(f);node=f;}
  node.connect(g);g.connect(master);env(g,t,o.a||.005,o.dur,o.vol||.2);os.start(t);os.stop(t+o.dur+.05);}
function noise(o){if(muted||!ac())return;const t=AC.currentTime+(o.delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=o.ft||'highpass';f.frequency.value=o.f||2000;
  if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur);const g=AC.createGain();s.connect(f);f.connect(g);g.connect(master);env(g,t,o.a||.003,o.dur,o.vol||.15);s.start(t,Math.random()*.5);s.stop(t+o.dur+.05);}
// 小方塊的可愛叫聲（上揚的「咿～」）
function wee(delay,pitch){const p=pitch||1;tone({type:'sawtooth',f0:380*p,f1:1150*p,dur:.32,slide:.3,vol:.11,delay,bp:1400*p,q:1.4,vib:28,vibAmt:35,a:.02});
  tone({type:'sine',f0:760*p,f1:2300*p,dur:.28,slide:.26,vol:.05,delay,a:.02});}
const SFX={
  pick(){tone({type:'triangle',f0:320,f1:880,dur:.16,vol:.22,vib:30,vibAmt:40});tone({type:'sine',f0:640,f1:1600,dur:.12,vol:.07});},
  tick(){tone({type:'sine',f0:1500,dur:.03,vol:.05});},
  place(){tone({type:'sine',f0:200,f1:70,dur:.16,vol:.4});noise({ft:'lowpass',f:1600,dur:.06,vol:.16});tone({type:'triangle',f0:900,f1:600,dur:.07,vol:.08,delay:.02});},
  back(){tone({type:'triangle',f0:600,f1:250,dur:.2,vol:.12});},
  clear(lines,combo){const base=[1046,1318,1568,2093,2637];const up=Math.min(combo,6)*0.06+1;
    base.forEach((f,i)=>tone({type:'triangle',f0:f*up,dur:.35,vol:.11,delay:i*.05}));
    noise({ft:'highpass',f:5000,dur:.6,vol:.08,a:.05});
    tone({type:'sine',f0:180,f1:900,dur:.4,vol:.08,slide:.35});
    const n=Math.min(3+lines*2,9);for(let i=0;i<n;i++)wee(.05+i*.07+Math.random()*.03,.85+Math.random()*.5+combo*.04);},
  pop(d){tone({type:'sine',f0:700+Math.random()*500,f1:1400,dur:.06,vol:.06,delay:d||0});},
  chime(){[1568,2093,2637,3136].forEach((f,i)=>tone({type:'sine',f0:f,dur:.5,vol:.1,delay:i*.08}));},
  rattle(){for(let i=0;i<10;i++){noise({ft:'bandpass',f:2500+Math.random()*2000,dur:.04,vol:.25,delay:i*.055+Math.random()*.02});tone({type:'square',f0:300+Math.random()*300,dur:.025,vol:.03,delay:i*.055});}},
  wow(){tone({type:'sawtooth',f0:220,f1:330,dur:.55,slide:.25,vol:.18,bp:900,q:1.2,vib:6,vibAmt:10,a:.04});tone({type:'sawtooth',f0:440,f1:660,dur:.5,slide:.25,vol:.08,bp:1800,q:2,a:.04});},
  hmph(){tone({type:'sawtooth',f0:260,f1:170,dur:.22,vol:.15,bp:700,q:1.5,a:.01});noise({ft:'bandpass',f:1200,dur:.15,vol:.08,delay:.03});},
  over(){[523,466,392,330,262].forEach((f,i)=>tone({type:'triangle',f0:f,dur:.32,vol:.16,delay:i*.18}));},
  click(){tone({type:'sine',f0:900,f1:1300,dur:.07,vol:.12});},
  drop(d){tone({type:'sine',f0:500,f1:900,dur:.1,vol:.08,delay:d||0});},
  win(){[523,659,784,1046,1318,1568].forEach((f,i)=>{tone({type:'triangle',f0:f,dur:.4,vol:.14,delay:i*.09});tone({type:'sine',f0:f*2,dur:.3,vol:.04,delay:i*.09});});noise({ft:'highpass',f:6000,dur:1,vol:.06,a:.2,delay:.4});},
  star(i){tone({type:'triangle',f0:1046*(1+i*.25),f1:2093*(1+i*.25),dur:.3,vol:.15,slide:.12});noise({ft:'highpass',f:5000,dur:.3,vol:.06});},
  whoosh(){noise({ft:'bandpass',f:400,f1:3000,dur:.35,vol:.15,a:.08});}
};
function drawSnd(){$('sndIcon').innerHTML='<path d="M3 9h4l5-4v14l-5-4H3z" fill="#fff"/>'+(muted?'<path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>':'<path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>');}
drawSnd();
$('sound').addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;store.set('cube_mute',muted?1:0);drawSnd();if(!muted)SFX.click();});

/* ---------------- 場景 ---------------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isMobile?2:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#f6c9cf');
const camera=new THREE.PerspectiveCamera(30,1,1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0xffc8b8,0.52));
const sun=new THREE.DirectionalLight(0xffffff,0.58);sun.position.set(5,16,10);sun.castShadow=true;
sun.shadow.mapSize.set(isMobile?1024:2048,isMobile?1024:2048);const sc=sun.shadow.camera;sc.left=-12;sc.right=12;sc.top=14;sc.bottom=-14;sc.near=1;sc.far=50;sun.shadow.bias=-0.0008;sun.shadow.radius=4;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xfff0f0,0.2);fill.position.set(-6,6,12);scene.add(fill);

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function clamp(v,a,b){return v<a?a:v>b?b:v}

function roundedBox(w,h,d,r,seg){
  const g=new THREE.BoxGeometry(w,h,d,seg,seg,seg);const p=g.attributes.position,n=g.attributes.normal;

  o2:[[0,0],[0,1],[1,0],[1,1]],o3:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]],r23:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]],
  c3:[[0,0],[1,0],[1,1]],l4:[[0,0],[1,0],[2,0],[2,1]],L5:[[0,0],[1,0],[2,0],[2,1],[2,2]],t4:[[0,0],[0,1],[0,2],[1,1]],s4:[[0,1],[0,2],[1,0],[1,1]]};
const WEIGHT={one:3,i2:5,i3:6,i4:5,i5:3,o2:6,o3:2,r23:4,c3:6,l4:6,L5:3,t4:5,s4:4};
const FAM_COLOR={one:'yellow',i2:'orange',i3:'blue',i4:'red',i5:'red',o2:'green',o3:'pink',r23:'green',c3:'purple',l4:'orange',L5:'blue',t4:'red',s4:'blue'};
function norm(cells){const mr=Math.min(...cells.map(c=>c[0])),mc=Math.min(...cells.map(c=>c[1]));return cells.map(([r,c])=>[r-mr,c-mc]);}
function rot(cells){return norm(cells.map(([r,c])=>[c,-r]));}
function randShape(){
  let tot=0;for(const k in WEIGHT)tot+=WEIGHT[k];let x=Math.random()*tot,fam='one';for(const k in WEIGHT){x-=WEIGHT[k];if(x<=0){fam=k;break;}}
  let cells=FAM[fam].map(c=>c.slice());const rn=(Math.random()*4)|0;for(let i=0;i<rn;i++)cells=rot(cells);
  if((fam==='l4'||fam==='s4')&&Math.random()<.5)cells=norm(cells.map(([r,c])=>[r,-c]));
  const color=Math.random()<.65?FAM_COLOR[fam]:CKEYS[(Math.random()*CKEYS.length)|0];
  return {cells,color};
}

let grid=[...Array(N)].map(()=>Array(N).fill(null)),tray=[null,null,null],score=0,shownScore=0,coins,combo=0,movesNoClear=0,meter=0,shakes=1,over=true,dragging=null,busy=false;

function canPlace(cells,r0,c0){for(const[r,c]of cells){const R=r0+r,C=c0+c;if(R<0||C<0||R>=N||C>=N||grid[R][C])return false;}return true;}
function fitsAnywhere(cells){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(canPlace(cells,r,c))return true;return false;}
function linesIf(cells,r0,c0){
  const occ=(R,C)=>!!grid[R][C]||cells.some(([r,c])=>r0+r===R&&c0+c===C);
  const rows=[],cols=[];for(let i=0;i<N;i++){let fr=true,fc=true;for(let j=0;j<N;j++){if(!occ(i,j))fr=false;if(!occ(j,i))fc=false;}if(fr)rows.push(i);if(fc)cols.push(i);}return {rows,cols};
}
function cellPos(r,c){return new THREE.Vector3(c-3.5,CY,r-3.5);}

function buildPiece(shape){
  const g=new THREE.Group();const h=Math.max(...shape.cells.map(c=>c[0]))+1,w=Math.max(...shape.cells.map(c=>c[1]))+1;
  const meshes=shape.cells.map(([r,c])=>{const m=makeCube(shape.color);m.position.set(c-(w-1)/2,0,r-(h-1)/2);g.add(m);return m;});
  const ps=Math.min(.5,2.25/Math.max(w,h));
  return {group:g,cells:shape.cells,w,h,color:shape.color,meshes,ps};
}
function platePos(i,p){return new THREE.Vector3(PLATE_X[i],PLATE_Y+CUBE/2*p.ps+.02,PLATE_Z);}
function genTray(){
  const out=[];let anyFit=false;const want=prog&&LEVELS[level].goals.find(g=>g.t==='color');
  for(let i=0;i<3;i++){let s=randShape();
    for(let t=0;t<10&&!fitsAnywhere(s.cells)&&Math.random()<.85;t++)s=randShape();
    if(want&&Math.random()<.3)s.color=want.c;
    if(fitsAnywhere(s.cells))anyFit=true;out.push(s);}
  if(!anyFit){for(let t=0;t<40;t++){const s=randShape();if(fitsAnywhere(s.cells)){out[0]=s;break;}}}
  return out;
}
function fillTray(){

    tween(.45,k=>{p.group.scale.setScalar(Math.max(.001,easeOutBack(k)*p.ps));p.group.position.y=pp.y+(1-easeOutCubic(k))*1.5;},null,i*.09);SFX.drop(i*.09);});

/* ---------------- 放置與消除 ---------------- */
function placePiece(slot,r0,c0){
  const p=tray[slot];tray[slot]=null;movesLeft--;
  const placed=[];
  p.meshes.forEach((m,i)=>{const[r,c]=p.cells[i];const wp=new THREE.Vector3();m.getWorldPosition(wp);p.group.remove(m);scene.add(m);m.position.copy(wp);m.scale.setScalar(1);
    grid[r0+r][c0+c]=m;placed.push([r0+r,c0+c]);const to=cellPos(r0+r,c0+c),from=wp.clone();
    tween(.09,k=>{m.position.lerpVectors(from,to,easeInQuad(k));},()=>{m.position.copy(to);tween(.4,k=>{const e=elastic(k);m.scale.set(1+(1-e)*.25,1-(1-e)*.35,1+(1-e)*.25);});});});
  scene.remove(p.group);SFX.place();
  setTimeout(()=>{const seen=new Set();placed.forEach(([r,c])=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const R=r+dr,C=c+dc;if(R<0||C<0||R>=N||C>=N)return;const m=grid[R][C];if(!m||seen.has(m)||placed.some(q=>q[0]===R&&q[1]===C))return;seen.add(m);
    tween(.35,k=>{const e=Math.sin(k*Math.PI)*.12*(1-k);m.scale.set(1+e,1-e,1+e);},()=>m.scale.set(1,1,1));}));},90);
  score+=p.cells.length;
  const rows=[],cols=[];for(let i=0;i<N;i++){if(grid[i].every(x=>x))rows.push(i);if(grid.every(row=>row[i]))cols.push(i);}
  const n=rows.length+cols.length;
  if(n){
    combo++;movesNoClear=0;const tri=n*(n+1)/2;const gained=80*combo*tri;score+=gained;coins+=n;store.set('cube_coins',coins);
    const set=new Map();rows.forEach(r=>{for(let c=0;c<N;c++)set.set(r*N+c,[r,c]);});cols.forEach(c=>{for(let r=0;r<N;r++)set.set(r*N+c,[r,c]);});
    const list=[];set.forEach(([r,c])=>{const m=grid[r][c];grid[r][c]=null;list.push({m,r,c});const col=m.userData.color;if(col==='stone')prog.stone++;else prog.colors[col]=(prog.colors[col]||0)+1;});
    prog.lines+=n;
    setTimeout(()=>clearLines(rows,cols,placed,gained,n,list),100);
  }else{
    movesNoClear++;if(movesNoClear>=3&&combo>0){combo=0;say('哼！','hmph',1.4);SFX.hmph();}
  }

  if(movesLeft===3)setTimeout(()=>say('只剩 3 步！','smug',1.5),300);
  if(!tray.some(x=>x))setTimeout(()=>{if(over)return;fillTray();setTimeout(checkStuck,600);},n?380:200);
  else{refreshTray();setTimeout(checkStuck,n?700:250);}
}
function clearLines(rows,cols,placed,gained,n,list){
  const oc=placed.reduce((a,[r,c])=>[a[0]+r/placed.length,a[1]+c/placed.length],[0,0]);
  const big=n>=2||combo>=3;

  center.divideScalar(list.length);center.y+=1;
  setTimeout(()=>floatText('+'+gained,center,big?'big':''),180);

    if(n>=2)setTimeout(()=>floatText(['','','漂亮！','超讚！','無敵！','神乎其技！'][Math.min(n,5)],new THREE.Vector3(0,2,0),'word'),420);}

function winLevel(){
  if(ended)return;ended=true;over=true;const L=LEVELS[level];
  const bonus=movesLeft*50;score+=bonus;
  const frac=movesLeft/L.moves;const st=frac>=.35?3:frac>=.15?2:1;
  if(st>starsOf(level))store.set('cube_lv_star_'+level,st);
  if(unlocked()<Math.min(level+1,LEVELS.length-1))store.set('cube_lv_unlock',level+1);
  const bk='cube_lv_best_'+level;const isBest=score>store.get(bk,0);if(isBest)store.set(bk,score);
  SFX.win();say('過關！','happy',2.5);mascotSpin();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const m=grid[r][c];if(m){setLook(m,'happy',false);showArms(m,true);const ph=Math.random()*6;tween(1.2,k=>{m.position.y=CY+Math.abs(Math.sin(k*Math.PI*4+ph))*.35*(1-k);},()=>m.position.y=CY);}}
  for(let i=0;i<6;i++)setTimeout(()=>{burst(new THREE.Vector3((Math.random()-.5)*8,1,(Math.random()-.5)*8),26,1.5);sparkle(new THREE.Vector3(0,1,0),6,8);},i*160);
  const last=level===LEVELS.length-1;
  post('levelComplete',{level:level+1,score,stars:st,bonus});if(last)post('allComplete',{score});
  setTimeout(()=>{
    showModal('<h2 class="win">'+(last?'全部破關！':'過關！')+'</h2><div class="stars">'+[0,1,2].map(i=>'<span class="st'+(i<st?' on':'')+'" style="animation-delay:'+(.2+i*.25)+'s">★</span>').join('')+'</div>'+
      '<div class="s">'+score.toLocaleString()+'</div><div class="b">剩餘步數獎勵 +'+bonus+(isBest?'　<b class="nbx">新紀錄！</b>':'')+'</div>'+
      '<div class="btns">'+(last?'':'<button data-act="next" class="g">下一關</button>')+'<button data-act="retry" class="o">再玩一次</button><button data-act="menu" class="p">選關</button></div>');
    if(st>0)[0,1,2].slice(0,st).forEach(i=>setTimeout(()=>SFX.star(i),200+i*250));
  },1400);
}
function failLevel(reason){
  if(ended)return;ended=true;over=true;SFX.over();say('嘿嘿～','smug',3);
  let i=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const m=grid[r][c];if(m){const mm=m;setTimeout(()=>setLook(mm,'sad',true),i*12);i++;}}
  tray.forEach(p=>p&&p.meshes.forEach(m=>setLook(m,'sad',true)));
  post('levelFail',{level:level+1,score,reason});
  setTimeout(()=>showModal('<h2>'+reason+'</h2><div class="b">第 '+(level+1)+' 關　'+LEVELS[level].name+'</div><div class="s">'+score.toLocaleString()+'</div>'+
    '<div class="glist">'+LEVELS[level].goals.map(g=>{const v=Math.min(goalVal(g),g.n);return '<div class="'+(v>=g.n?'ok':'')+'">'+goalIcon(g)+goalText(g)+'　<b>'+v+'/'+g.n+'</b></div>';}).join('')+'</div>'+
    '<div class="btns"><button data-act="retry" class="g">再試一次</button><button data-act="menu" class="p">選關</button></div>'),1300);
}

/* ---------------- 選單畫面 ---------------- */
function showModal(html){$('card').innerHTML=html;$('modal').classList.add('on');}
function hideModal(){$('modal').classList.remove('on');}
function showMenu(){
  over=true;const un=unlocked();let h='<h1>萌萌方塊消消樂</h1><div class="b">選擇關卡</div><div class="lvgrid">';
  LEVELS.forEach((L,i)=>{const lock=i>un;const st=starsOf(i);h+='<button class="lv'+(lock?' lock':'')+'" data-act="'+(lock?'locked':'intro')+'" data-lv="'+i+'">'+(lock?'<svg viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="9" rx="2" fill="#a07a5a"/><path d="M7 9V6a3 3 0 016 0v3" stroke="#a07a5a" stroke-width="2.4" fill="none"/></svg>':'<b>'+(i+1)+'</b><i>'+'★★★'.slice(0,st)+'<span>'+'★★★'.slice(st)+'</span></i>')+'</button>';});
  h+='</div>'+(EMBED?'<div class="btns"><button data-act="exit" class="p">離開</button></div>':'');
  showModal(h);post('menu');
}
function showIntro(i){
  level=i;const L=LEVELS[i];
  showModal('<div class="b">第 '+(i+1)+' 關</div><h2>'+L.name+'</h2><div class="glist">'+L.goals.map(g=>'<div>'+goalIcon(g)+goalText(g)+'</div>').join('')+'<div><i class="mini" style="background:#8d4a1d"></i>在 '+L.moves+' 步內完成</div></div>'+
    '<div class="btns"><button data-act="start" class="g">開始</button><button data-act="menu" class="p">返回</button></div>');
}
function showPause(){
  if(ended||over&&!prog)return;const was=over;over=true;
  showModal('<h2>暫停</h2><div class="b">第 '+(level+1)+' 關　'+LEVELS[level].name+'</div><div class="btns col"><button data-act="resume" class="g">繼續</button><button data-act="retry" class="o">重新開始</button><button data-act="menu" class="p">選關</button>'+(EMBED?'<button data-act="exit" class="p">離開</button>':'')+'</div>');
  $('card').dataset.was=was?'1':'0';
}
$('card').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;ac();const act=b.dataset.act;
  if(act==='locked'){SFX.hmph();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');return;}
  SFX.click();
  if(act==='intro')showIntro(+b.dataset.lv);
  else if(act==='start')startLevel(level);
  else if(act==='next')startLevel(level+1);
  else if(act==='retry')startLevel(level);
  else if(act==='menu')showMenu();
  else if(act==='resume'){hideModal();over=$('card').dataset.was==='1';}
  else if(act==='exit'){post('exit',{});}
});
$('pause').addEventListener('pointerdown',e=>{e.stopPropagation();SFX.click();showPause();});
// 讓外層遊戲可以控制
addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object'||d.target!=='cube-puzzle')return;
  if(d.type==='startLevel')startLevel((d.level||1)-1);
  else if(d.type==='showMenu')showMenu();
  else if(d.type==='mute'){muted=!!d.value;drawSnd();}
  else if(d.type==='unlockAll')store.set('cube_lv_unlock',LEVELS.length-1);
  else if(d.type==='pause')showPause();
});

/* ---------------- 鏡頭 ---------------- */
const camBase=new THREE.Vector3(),camTarget=new THREE.Vector3();
const PITCH=60*Math.PI/180;
function fit(){
  const W=innerWidth,H=innerHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
  const topPx=Math.max(140,H*.17),botPx=Math.max(108,H*.15);const yHi=1-2*topPx/H,yLo=-1+2*botPx/H;
  const colW=Math.min(W,560);const xLim=Math.min(.97,colW/W*.97);
  const pts=[];for(const x of[-5.2,5.2])for(const z of[-5.25,PLATE_Z+PLATE_R])for(const y of[0,.6])pts.push(new THREE.Vector3(x,y,z));
  const dir=new THREE.Vector3(0,-Math.sin(PITCH),-Math.cos(PITCH));let D=30,tz=1.5;const v=new THREE.Vector3();
  for(let it=0;it<80;it++){camTarget.set(0,0,tz);camera.position.copy(camTarget).addScaledVector(dir,-D);camera.lookAt(camTarget);camera.updateMatrixWorld();
    let x0=9,x1=-9,y0=9,y1=-9;pts.forEach(p=>{v.copy(p).project(camera);x0=Math.min(x0,v.x);x1=Math.max(x1,v.x);y0=Math.min(y0,v.y);y1=Math.max(y1,v.y);});
    const s=Math.max((x1-x0)/(2*xLim),(y1-y0)/(yHi-yLo));D*=1+(s-1)*.6;tz-=(y0-yLo)*D*.12;}
  camBase.copy(camera.position);
}
addEventListener('resize',fit);fit();
const _v=new THREE.Vector3();
function toScreen(w){_v.copy(w).project(camera);return {x:(_v.x+1)/2*innerWidth,y:(1-_v.y)/2*innerHeight};}

/* ---------------- 操作（觸控＋滑鼠） ---------------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function hitPlane(e,y){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const d=ray.ray.direction,o=ray.ray.origin;const t=(y-o.y)/d.y;return o.clone().addScaledVector(d,t);}
function pickSlot(e){
  let best=-1,bd=1e9;for(let i=0;i<3;i++){if(!tray[i])continue;const c=toScreen(new THREE.Vector3(PLATE_X[i],.2,PLATE_Z));const ed=toScreen(new THREE.Vector3(PLATE_X[i]+PLATE_R,.2,PLATE_Z));
    const rad=Math.abs(ed.x-c.x)*1.2;const d=Math.hypot(e.clientX-c.x,e.clientY-c.y);if(d<rad&&d<bd){bd=d;best=i;}}
  return best;
}
canvas.addEventListener('pointerdown',e=>{
  ac();if(over||busy||dragging)return;const s=pickSlot(e);if(s<0)return;
  const p=tray[s];const touch=e.pointerType!=='mouse';
  dragging={slot:s,p,id:e.pointerId,offZ:touch?2.3+p.h*.5:.9+p.h*.5,cell:null,lines:null,hi:[]};
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  p.meshes.forEach(m=>setLook(m,'idle',false));
  SFX.pick();const s0=p.group.scale.x;tween(.15,k=>{if(dragging&&dragging.p===p)p.group.scale.setScalar(s0+(1-s0)*easeOutBack(k));});
  moveDrag(e,true);
});
function clearHi(){if(!dragging)return;dragging.hi.forEach(m=>{if(m.userData.expr==='surprised'||m.userData.pale)setLook(m,'idle',false);});dragging.hi=[];ghosts.forEach(g=>g.visible=false);}
function moveDrag(e,instant){
  if(!dragging||e.pointerId!==dragging.id)return;const p=dragging.p;
  const h=hitPlane(e,CY);const tx=h.x,tz=h.z-dragging.offZ;
  p.group.userData.target=new THREE.Vector3(tx,CY+LIFT,tz);if(instant)p.group.position.copy(p.group.userData.target);
  const c0=Math.round(tx-(p.w-1)/2+3.5),r0=Math.round(tz-(p.h-1)/2+3.5);
  const key=r0+','+c0;
  if(dragging.cell===key)return;dragging.cell=key;
  clearHi();
  if(canPlace(p.cells,r0,c0)){
    dragging.r0=r0;dragging.c0=c0;dragging.valid=true;SFX.tick();
    p.cells.forEach(([r,c],i)=>{const g=ghosts[i];g.visible=true;g.material.color.set(COLORS[p.color]);g.material.opacity=.45;g.position.set(c0+c-3.5,BOARD_TOP+.02,r0+r-3.5);});
    const {rows,cols}=linesIf(p.cells,r0,c0);const hi=new Set();
    rows.forEach(r=>{for(let c=0;c<N;c++)if(grid[r][c])hi.add(grid[r][c]);});cols.forEach(c=>{for(let r=0;r<N;r++)if(grid[r][c])hi.add(grid[r][c]);});
    hi.forEach(m=>setLook(m,'surprised',true));dragging.hi=[...hi];
    if(hi.size||rows.length||cols.length)p.meshes.forEach(m=>setLook(m,'surprised',false));else p.meshes.forEach(m=>setLook(m,'idle',false));
  }else{dragging.valid=false;p.meshes.forEach(m=>setLook(m,'idle',false));}
}
addEventListener('pointermove',e=>{if(dragging)moveDrag(e);},{passive:true});
function endDrag(e){
  if(!dragging||e.pointerId!==dragging.id)return;const d=dragging;clearHi();dragging=null;const p=d.p;
  if(d.valid&&tray[d.slot]===p){placePiece(d.slot,d.r0,d.c0);}
  else{SFX.back();const from=p.group.position.clone(),to=platePos(d.slot,p),s0=p.group.scale.x;p.group.userData.target=null;
    tween(.25,k=>{const e2=easeOutCubic(k);p.group.position.lerpVectors(from,to,e2);p.group.scale.setScalar(s0+(p.ps-s0)*e2);},()=>{refreshTray();});}
}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- 主迴圈 ---------------- */
let last=performance.now(),time=0;
function loop(now){
  requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];t.t+=dt;if(t.t<0)continue;const k=Math.min(1,t.t/t.dur);t.fn(k);if(k>=1){tweens.splice(i,1);t.done&&t.done();}}
  // 拖曳中的方塊跟隨
  if(dragging){const g=dragging.p.group;if(g.userData.target)g.position.lerp(g.userData.target,1-Math.pow(.0005,dt));
    dragging.p.meshes.forEach((m,i)=>{m.rotation.z=Math.sin(time*10+i)*.04;});}
  // 眨眼
  const blinkable=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid&&grid[r][c])blinkable.push(grid[r][c]);
  tray&&tray.forEach(p=>p&&p.meshes.forEach(m=>blinkable.push(m)));
  blinkable.forEach(m=>{const u=m.userData;if(u.expr!=='idle'&&u.expr!=='blink')return;u.blinkT-=dt;
    if(u.blinkT<=0){if(u.expr==='idle'){setLook(m,'blink');u.blinkT=.13;}else{setLook(m,'idle');u.blinkT=2+Math.random()*6;}}});
  // 盤子上的方塊輕輕呼吸
  tray&&tray.forEach((p,i)=>{if(!p||(dragging&&dragging.p===p))return;p.group.rotation.y=Math.sin(time*1.5+i)*.05;});
  // 飛走的方塊
  for(let i=flying.length-1;i>=0;i--){const f=flying[i],m=f.m;f.life+=dt;f.v.y-=26*dt;m.position.addScaledVector(f.v,dt);m.rotation.x+=f.w.x*dt;m.rotation.y+=f.w.y*dt;m.rotation.z+=f.w.z*dt;
    const inTray=Math.abs(m.position.x)<5&&Math.abs(m.position.z)<5;const floor=(inTray?BOARD_TOP:0)+.45;
    if(m.position.y<floor&&f.v.y<0){m.position.y=floor;f.v.y*=-.38;f.v.x*=.7;f.v.z*=.7;f.w.multiplyScalar(.6);}
    if(m.userData.arms)m.userData.arms.forEach(a=>a.rotation.z=a.userData.sd*(.9+Math.sin(time*25)*.6));
    if(f.life>1.25){const k=(f.life-1.25)/.3;m.scale.setScalar(Math.max(.001,1-k));if(k>=1){scene.remove(m);flying.splice(i,1);}}}
  for(let i=confetti.length-1;i>=0;i--){const p=confetti[i];p.life-=dt;p.v.y-=14*dt;p.v.multiplyScalar(1-1.6*dt);p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=p.w.x*dt;p.m.rotation.y+=p.w.y*dt;
    if(p.m.position.y<.05){p.m.position.y=.05;p.v.set(0,0,0);p.w.set(0,0,0);}
    if(p.life<.3)p.m.scale.setScalar(Math.max(.001,p.life/.3));if(p.life<=0){scene.remove(p.m);confetti.splice(i,1);}}
  for(let i=stars.length-1;i>=0;i--){const s=stars[i];s.max+=dt;s.s.position.addScaledVector(s.v,dt);const k=s.max/s.life;s.s.material.opacity=1-k;s.s.material.rotation+=dt*3;const z=s.sz*(k<.2?k/.2:1);s.s.scale.set(z,z,1);
    if(k>=1){scene.remove(s.s);s.s.material.dispose();stars.splice(i,1);}}
  // 吉祥物
  mascot.position.y=Math.sin(time*2.2)*.06;mascot.rotation.y=-.35+Math.sin(time*.9)*.12;
  if(mascotExprT>0){mascotExprT-=dt;if(mascotExprT<=0&&!over)mascotFace('grump');}
  if(bubbleT>0){bubbleT-=dt;if(bubbleT<=0)bubble.classList.remove('on');}
  const bp=toScreen(new THREE.Vector3(MPOS.x-.2,MPOS.y+2.6+mInner.position.y,MPOS.z));bubble.style.left=Math.min(innerWidth-60,bp.x)+'px';bubble.style.top=bp.y+'px';
  // 分數滾動
  if(shownScore!==score){shownScore+=Math.max(1,Math.ceil((score-shownScore)*Math.min(1,dt*8)));if(shownScore>score)shownScore=score;$('score').textContent=shownScore.toLocaleString();}
  // 震動
  camera.position.copy(camBase);if(shakeAmt>0){camera.position.x+=(Math.random()-.5)*shakeAmt;camera.position.y+=(Math.random()-.5)*shakeAmt;camera.position.z+=(Math.random()-.5)*shakeAmt*.5;shakeAmt=Math.max(0,shakeAmt-dt*1.2);}
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);updHud();
const qlv=parseInt(params.get('level')||'0',10);if(qlv>=1&&qlv<=LEVELS.length)showIntro(qlv-1);else showMenu();
post('ready',{levels:LEVELS.length});
})();
</script>
