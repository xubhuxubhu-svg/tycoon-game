<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>萌萌軍團大衝鋒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
:root{--f:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--navy:#1f2b4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd6e8;font-family:var(--f);touch-action:none;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 20% 20%,#fff3 0 8%,transparent 9%) 0 0/60px 60px,
 radial-gradient(circle at 70% 60%,#ffffff40 0 6%,transparent 7%) 0 0/80px 80px,linear-gradient(135deg,#ffd1e6,#cfe6ff 60%,#d9fbe4)}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;
 background:linear-gradient(#a9dcff 0%,#d6efff 14%);touch-action:none}
@media (min-aspect-ratio:7/10){#wrap{width:min(100vw,62vh);border-radius:22px;box-shadow:0 10px 50px #0003;height:min(100vh,100%)}}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
.btn,button{pointer-events:auto;font-family:var(--f);cursor:pointer;border:none}
/* 上方列 */
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .4s}
#lvl{background:var(--navy);color:#fff;padding:6px 12px;border-radius:12px;font-size:17px;box-shadow:0 3px 0 #0b1430;border:2px solid #ffffff55;white-space:nowrap}
#bar{flex:1;height:14px;background:#1f2b4daa;border-radius:10px;position:relative;border:2px solid #fff8}
#barfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7cc4ff,#4f8dff);border-radius:10px}
.mk{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#ff5d73;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 0 #0003}
.mk.done{background:#4f8dff}
#snd{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;font-size:20px;box-shadow:0 3px 0 #0b1430;border:2px solid #ffffff55}
/* 下方兵力 */
#chips{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:0 10px;opacity:0;transition:opacity .4s}
.chip{display:flex;align-items:center;gap:3px;padding:3px 9px 3px 4px;border-radius:14px;color:#fff;font-size:16px;border:2px solid #fff;box-shadow:0 2px 0 #0003;text-shadow:0 1px 0 #0004}
.chip img{width:22px;height:22px}
.chip.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}
#hint{position:absolute;left:0;right:0;bottom:16%;text-align:center;color:#fff;font-size:24px;text-shadow:0 2px 0 #1f2b4d,0 0 8px #1f2b4d;opacity:0;transition:opacity .4s;animation:sway 1.2s ease-in-out infinite}
@keyframes sway{50%{transform:translateX(12px)}}
/* 敵軍標籤 */
.elabel{position:absolute;left:0;top:0;transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform}
.etitle{background:#ffd23f;color:#5a3a00;font-size:14px;padding:2px 10px;border-radius:8px;border:2px solid #fff;box-shadow:0 2px 0 #0003;white-space:nowrap}
.erow{display:flex;gap:3px}
.ec{display:flex;align-items:center;gap:2px;background:#ff4d63;color:#fff;font-size:15px;padding:2px 7px 2px 3px;border-radius:9px;border:2px solid #fff;box-shadow:0 2px 0 #0003;white-space:nowrap}
.ec img{width:18px;height:18px}
.ec.weak{background:#2fbf71}
/* 漂浮字 */
.ft{position:absolute;left:0;top:0;white-space:nowrap;font-size:26px;color:#fff;text-shadow:0 3px 0 #1f2b4d,0 0 6px #1f2b4d;will-change:transform,opacity;pointer-events:none}
.ft.big{font-size:36px;color:#fff36b}
.ft.green{color:#7dffb0;font-size:34px}
.ft img{width:28px;height:28px;vertical-align:-5px}
/* 橫幅 */
#banner{position:absolute;left:0;right:0;top:15%;text-align:center;pointer-events:none;opacity:0}
#banner .t{display:inline-block;font-size:32px;color:#fff;text-shadow:0 3px 0 #1f2b4d,0 0 10px #1f2b4d;padding:0 10px;line-height:1.25}
#banner .t img{width:38px;height:38px;vertical-align:-7px;border-radius:9px;padding:3px;margin-right:4px;border:2px solid #fff}
#banner .s{font-size:19px;color:#ffe46b;text-shadow:0 2px 0 #1f2b4d;margin-top:4px}
#banner.red .t{background:linear-gradient(#ff4d63,#e0304a);border:3px solid #fff;border-radius:14px;padding:4px 26px;letter-spacing:6px;text-shadow:0 2px 0 #8a1020}
#banner.show{animation:bin 2.4s forwards}
@keyframes bin{0%{opacity:0;transform:scale(.3) rotate(-6deg)}12%{opacity:1;transform:scale(1.15) rotate(2deg)}20%{transform:scale(1) rotate(0)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8) translateY(-30px)}}
/* 畫面 */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;background:#1f2b4d55;backdrop-filter:blur(2px);padding:20px;text-align:center}
.hide{display:none!important}
.title{font-size:44px;line-height:1.1;color:#fff;text-shadow:0 4px 0 #ff5d8f,0 8px 0 #1f2b4d,0 0 20px #fff8;animation:float 2s ease-in-out infinite;margin-bottom:8px}
.title small{display:block;font-size:22px;color:#ffe46b;text-shadow:0 3px 0 #1f2b4d;margin-top:8px}
@keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}
.big-btn{margin-top:16px;font-size:28px;padding:14px 46px;border-radius:22px;background:linear-gradient(#ffe066,#ffb627);color:#5a3a00;box-shadow:0 6px 0 #c47f00,0 10px 20px #0004;border:3px solid #fff;animation:pulse 1.4s ease-in-out infinite}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c47f00}
@keyframes pulse{50%{transform:scale(1.06)}}
.small-btn{margin-top:12px;font-size:17px;padding:8px 18px;border-radius:14px;background:#ffffffdd;color:var(--navy);box-shadow:0 3px 0 #0003}
.card{background:#fffffff0;border-radius:22px;padding:14px;max-width:360px;width:100%;box-shadow:0 8px 0 #0002;border:3px solid #fff;color:var(--navy)}
.vt{font-size:54px;color:#ffd23f;text-shadow:0 4px 0 #c47f00,0 8px 0 #1f2b4d;margin-bottom:4px}
.vt.lose{color:#ff8fa3;text-shadow:0 4px 0 #b02a46,0 8px 0 #1f2b4d}
.vs{font-size:20px;color:#fff;text-shadow:0 2px 0 #1f2b4d;margin-bottom:10px}
.vchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.dex{display:grid;grid-template-columns:1fr;gap:6px;max-height:52vh;overflow:auto;text-align:left}
.dx{display:flex;align-items:center;gap:8px;padding:5px;border-radius:12px;background:#f1f5ff;font-size:16px}
.dx .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 0 #0002;flex:none}
.dx .ic img{width:30px;height:30px}
.dx .mini{display:inline-flex;align-items:center;gap:2px;padding:1px 6px 1px 2px;border-radius:8px;color:#fff;font-size:13px;margin:0 2px}
.dx .mini img{width:16px;height:16px}
.dx.lock{opacity:.4}
.credit{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));font-size:13px;color:#fff;text-shadow:0 1px 0 #1f2b4d;opacity:.9}
.tip{font-size:16px;color:#fff;text-shadow:0 2px 0 #1f2b4d;line-height:1.6;margin-top:10px}
#winStars{font-size:46px;letter-spacing:6px;margin:-4px 0 6px}
#winStars span{color:#ffffff66;text-shadow:0 3px 0 #1f2b4d}
#winStars span.on{color:#ffd23f;animation:starpop .5s backwards}
#winStars span.on:nth-child(2){animation-delay:.25s}#winStars span.on:nth-child(3){animation-delay:.5s}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0}
.lv{aspect-ratio:1;border-radius:14px;background:linear-gradient(#7cc4ff,#4f8dff);color:#fff;font-size:24px;box-shadow:0 4px 0 #2d5fc9;border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lv i{font-style:normal;font-size:11px;color:#ffe46b;margin-top:3px;letter-spacing:-1px}
.lv.cur{background:linear-gradient(#ffe066,#ffb627);color:#5a3a00;box-shadow:0 4px 0 #c47f00}
.lv.lock{background:#c9cede;box-shadow:0 4px 0 #9aa0b5;font-size:18px}
.backBtn{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;font-size:16px;padding:7px 14px;border-radius:14px;background:#ffffffdd;color:#1f2b4d;box-shadow:0 3px 0 #0003;z-index:5}
#hud .backBtn{position:static;padding:6px 10px;font-size:15px}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="labels"></div>
    <div id="floaters"></div>
    <div id="hud">
      <button class="backBtn hide">← 返回</button><div id="lvl">第 1 關</div>
      <div id="bar"><div id="barfill"></div></div>
      <button id="snd">🔊</button>
    </div>
    <div id="chips"></div>
    <div id="hint">◀ 拖曳控制方向 ▶</div>
    <div id="banner"><div class="t"></div><div class="s"></div></div>
    <div id="flash"></div>

    <div id="start" class="screen">
      <div class="title">萌萌軍團<br>大衝鋒！<small>選對兵種，攻下要塞</small></div>
      <div id="startLvl" class="vs">第 1 關</div>
      <button id="go" class="big-btn">開始衝鋒！</button>
      <div class="row2"><button id="selBtn" class="small-btn">🗺️ 選擇關卡</button><button id="dexBtn" class="small-btn">📖 兵種克制表</button></div>
      <div class="tip">拖曳左右移動，穿過「＋數字」的門增加兵力<br>用能「克制」敵人的兵種，打起來超強！</div>
      <div class="credit">遊戲製作：Eric Hu</div>
      <button class="backBtn hide">← 返回</button>
    </div>

    <div id="dex" class="screen hide">
      <div class="card"><div style="font-size:24px;margin-bottom:8px">📖 兵種克制表</div><div class="dex" id="dexList"></div>
      <button id="dexClose" class="small-btn" style="background:#4f8dff;color:#fff">知道了！</button></div>
    </div>

    <div id="win" class="screen hide">
      <div class="vt">勝利！</div>
      <div id="winStars"></div>
      <div class="vs" id="winSub">第 1 關 要塞攻下了！</div>
      <div class="vchips" id="winChips"></div>
      <button id="next" class="big-btn">下一關 ▶</button>
      <div class="row2"><button id="selBtn2" class="small-btn">🗺️ 選擇關卡</button><button id="homeBtn" class="small-btn">🏠 主畫面</button></div>
    </div>

    <div id="lose" class="screen hide">
      <div class="vt lose">全軍覆沒…</div>
      <div class="vs">別灰心！試試用「克制」的兵種吧</div>
      <button id="retry" class="big-btn">再試一次</button>
      <div class="row2"><button id="dexBtn2" class="small-btn">📖 兵種克制表</button><button id="selBtn3" class="small-btn">🗺️ 選擇關卡</button><button id="homeBtn2" class="small-btn">🏠 主畫面</button></div>
    </div>

    <div id="sel" class="screen hide">
      <div class="card"><div style="font-size:24px;margin-bottom:6px">🗺️ 選擇關卡</div>
      <div class="grid" id="selGrid"></div>
      <div style="font-size:13px;opacity:.7">打贏一關就能解鎖下一關，存活越多星星越多</div>
      <button id="selClose" class="small-btn" style="background:#4f8dff;color:#fff">關閉</button></div>
    </div>

    <div id="all" class="screen hide">
      <div class="vt" style="font-size:46px">🎉 全部通關！🎉</div>
      <div class="vs">10 座要塞全部攻下了，你是最強指揮官！</div>
      <div class="vs" id="allStars" style="font-size:24px;color:#ffe46b"></div>
      <button id="again" class="big-btn">從第 1 關再玩</button>
      <button id="selBtn4" class="small-btn">🗺️ 選擇關卡</button>
    </div>
  </div>
</div>
