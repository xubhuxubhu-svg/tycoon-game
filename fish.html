<style>

canvas{display:block;width:100%;height:100%}

.note2{background:#f6fbef;border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.6;margin:6px 0;color:#4a5a3a}
.prof{display:grid;gap:6px;margin:6px 0}.prof button{border:2px solid #d8eac4;border-radius:14px;background:#fbfff5;padding:8px 10px;text-align:left;font-family:inherit;color:#2d4a18;font-size:15px}.prof button span{font-size:12px;color:#5a6a4a;line-height:1.6}.prof button.on{border-color:#ffb300;background:#fff4c8;box-shadow:0 0 0 2px #ffb300}

.shop .bt{display:flex;gap:5px;justify-content:center;margin-top:3px}.shop .bt button{border:none;border-radius:10px;padding:4px 10px;font-size:13px;color:#fff;background:linear-gradient(#5aa8f5,#2f7bd6);box-shadow:0 2px 0 #1f4e88;font-family:inherit}.shop small{font-size:11px;color:#8a6a3a}

.chooser button{color:#2d4a18}
.hb.r{background:linear-gradient(#ff9a7a,#e0603a);box-shadow:0 3px 0 #a8401a}
#bMenu{display:none}
#money{cursor:pointer;text-align:right;line-height:1.15}

#homeUI .hm{pointer-events:auto;padding:8px 16px;text-align:center;font-size:15px;line-height:1.5;border-color:#ffb36b;box-shadow:0 3px 0 #d08a3a;max-width:94vw}#homeUI .act{color:#c0602a;font-weight:bold}#homeUI .hbtn{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:4px}#homeUI .hbtn .hb{font-size:14px;padding:6px 12px}
.ward{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}#wardCv{width:210px;height:210px;border-radius:18px;background:linear-gradient(#e8f6ff,#fffbe8);box-shadow:inset 0 0 0 3px #d8eac4}.winf{flex:1;min-width:180px;font-size:13px;line-height:1.6}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:8px 0}.wgrid button{border:2px solid #d8eac4;border-radius:14px;background:#fbfff5;padding:4px;display:flex;flex-direction:column;align-items:center;font-family:inherit;color:#2d4a18}.wgrid button span{font-size:28px}.wgrid button b{font-size:12px}.wgrid button small{font-size:11px;color:#a06a00}.wgrid button.on{border-color:#ffb300;background:#fff4c8;box-shadow:0 0 0 2px #ffb300}

.wtag{font-size:11px;color:#fff;background:rgba(60,90,40,.85);border-radius:8px;padding:1px 6px}
.say{background:#fff;border:3px solid #ffb300;border-radius:14px;padding:4px 10px;font-size:14px;color:#6a4a00;position:relative;text-align:center;line-height:1.35}
.say:after{content:'';position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:#ffb300;border-bottom:0}
.sign.ripe{background:#c08a00;border-color:#ffe36a;box-shadow:0 3px 0 #7a5a00}.sign.warn{background:#c0461a;border-color:#ffc0a0}.sign.dry{background:#2f6fa8}.sign.broken{background:#6a5a4a}.sign.lot{background:#6a4aa8;border-color:#d8c8ff;box-shadow:0 3px 0 #3a2a6a}

<body>
<div id="night"></div><div id="tint"></div>
<div id="lbls"></div>
<div id="hud">
  <div id="clock" class="box"></div>
  <div id="goal" class="box"></div>
  <div id="banner" class="box"></div>
  <div id="money" class="box">💵 0</div>

</div>

<div id="joy"><i></i></div>
<div id="modal"><div id="panel"></div></div>

<script type="module">
import * as THREE from 'three';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

function billsOf(){const w=STAFF.reduce((a,s)=>a+(S.staff[s.id]?s.wage:0),0),m=MACH.reduce((a,x)=>a+(S.mach[x.id]&&x.day?x.day:0),0),f=farmRentDay(),b=S.boats.reduce((a,x)=>a+boatDef(x.id).day,0);return {w,m,f,b,tot:Math.round((w+m+f+b)*prof().bill)}}
function newDay(day,offline){const B=billsOf();if(B.tot){let pay=B.tot;if(S.money<pay){if(offline&&prof().protect){pay=Math.max(0,Math.floor(S.money))}else{S.debt+=pay-Math.floor(Math.max(0,S.money));pay=Math.floor(Math.max(0,S.money))}}S.money-=pay;S.flow.push([S.t,-pay,'bill']);S.lastBill=B}

let wildT=0;
function step(dt,offline){S.t+=dt;const prot=offline&&prof().protect;const w=curW();
  const day=dayOf(S.t);if(S.day<0)S.day=day;if(day!==S.day){S.day=day;newDay(day,offline)}
  // 魚簍裡的魚慢慢變不新鮮
  if(!prot){const k=S.own.ice?.2:1;for(const it of S.bag)if(isFish(it)&&!it.frozen&&!it.dried)it.age=(it.age||0)+dt*k}
  // 船
  for(const b of S.boats){if(b.st!=='sea')continue;const back=boatBack(b);if(w.typhoon&&!TUTON){returnBoat(b,clamp((S.t-b.t0)/(back-b.t0),.1,1)*.5,true);continue}if(S.t>=back){returnBoat(b,1,false);if(S.staff.crew&&b.auto&&!canSail())sailBoat(b,b.zone,b.dur)}}

  for(const i in S.farms){const f=S.farms[i],T=FARM_T[FARM_SLOTS[i].t];if(f.st!=='grow')continue;if(T.feed&&(S.mach.feeder||S.staff.farmer)&&f.food<.3)farmFeed(+i,true);
    const fed=!T.feed||f.food>0;if(T.feed&&f.food>0)f.food=Math.max(0,f.food-dt/Math.max(DAY*2,f.dur/2));if(fed&&!red)f.g+=dt/f.dur*(S.mach.aerator?1.2:1);if(f.g>=1){f.g=1;f.st='ripe';if(S.staff.farmer)farmHarvest(+i,true);else if(!offline)notify(`${T.em} ${T.n}的 ${FISH[f.k].n} 可以收成了！`)}}

  for(let i=0;i<S.racks.length;i++){const r=S.racks[i];if(!r||r.st!=='dry')continue;const cov=S.mach.rackCover;if(w.wet&&!cov){if(S.staff.dryer){continue}if(!prot&&(w.typhoon||curWk()==='storm')&&!r.warned){r.warned=1;const lost=Math.ceil(r.list.length*.3);r.list.splice(0,lost);notify(`⛈️ 大風雨吹走了曬魚架上的 ${lost} 條魚！（買遮雨棚或雇曬魚阿姨）`,1);if(!r.list.length){S.racks[i]=null;continue}}continue}
    r.g+=dt/DRY_T*(w.hot?1.4:1);if(r.g>=1){r.st='done';if(S.staff.dryer){const L=r.list;S.racks[i]=null;L.forEach(it=>{it.dried=1});let n=0;for(const it of L){if(S.freezer.length<freezerCap()){S.freezer.push(it);n++}}const rest=L.slice(n);if(rest.length)sellList(rest,1,'dry');if(!offline)notify(`👵 曬魚阿姨收好 ${L.length} 條魚乾${n?'，放進冷凍庫':''}`)}else if(!offline)notify('☀️ 魚乾曬好了！到曬魚架收')}}

  // 颱風前預告
  const pi=Math.floor(S.t/PERIOD);if(pi!==S.lastP){S.lastP=pi;const nx=WEATHER[weatherAt(pi+1)];if(!offline){if(w.typhoon)notify('🌀 颱風來了！船都回港、曬魚架要收、待在室內比較安全',1);else if(nx.typhoon)notify('⚠️ 颱風快來了！30 分鐘後海上很危險，出海的船會被強制回港',1);else if(w.wet&&S.racks.some(r=>r&&r.st==='dry')&&!S.mach.rackCover&&!S.staff.dryer)notify('🌧️ 下雨了！曬魚架停止曬乾')}}}

/* ---- 自動走路（避開海） ---- */
const NODES=[V(0,0,-4),V(10,0,-4),V(31,0,-4),V(-40,0,-4),V(-5,0,-4.5),V(-5,0,-8.5),V(-5,0,-18),V(-30,0,-8.5),V(-30,0,-18),V(0,0,-8),V(0,0,-23.5),V(-6.5,0,-23.5),V(6.5,0,-23.5),V(10,0,-8.6),V(31,0,-8.6),V(34,0,-8.6),V(34,0,-15.5),V(10,0,-15.5),V(36,0,-13),V(36,0,-27),V(-46,0,-6)];
const inBlk=(x,z,m)=>{for(const [bx,bz,w,d] of BLOCKS)if(Math.abs(x-bx)<w/2+m&&Math.abs(z-bz)<d/2+m)return true;return false};
{const add=(x,z)=>{if(!onWalk(x,z)||inBlk(x,z,.5))return;if(NODES.some(n=>Math.hypot(n.x-x,n.z-z)<1))return;NODES.push(V(x,0,z))};for(const [bx,bz,w,d] of BLOCKS)for(const sx of [-1,1])for(const sz of [-1,1])add(bx+sx*(w/2+.9),bz+sz*(d/2+.9));
  for(let i=NODES.length-1;i>=0;i--)if(inBlk(NODES[i].x,NODES[i].z,.4))NODES.splice(i,1)}
function segOK(a,b){const d=a.distanceTo(b),n=Math.ceil(d/.4);for(let i=1;i<n;i++){const t=i/n,x=a.x+(b.x-a.x)*t,z=a.z+(b.z-a.z)*t;if(!onWalk(x,z)||inBlk(x,z,.3))return false}return true}
let ADJ=null;function adj(){if(ADJ)return ADJ;ADJ=NODES.map((a,i)=>NODES.map((b,j)=>i!==j&&segOK(a,b)?a.distanceTo(b):0));return ADJ}
function route(from,to){if(segOK(from,to))return [to];const A=adj(),n=NODES.length;const S0=NODES.map(v=>segOK(from,v)?from.distanceTo(v):0),E0=NODES.map(v=>segOK(v,to)?v.distanceTo(to):0);
  const dist=Array(n).fill(1e9),prev=Array(n).fill(-1),done=Array(n).fill(0);for(let i=0;i<n;i++)if(S0[i])dist[i]=S0[i];let best=1e9,bi=-1;
  for(let k=0;k<n;k++){let u=-1;for(let i=0;i<n;i++)if(!done[i]&&dist[i]<1e9&&(u<0||dist[i]<dist[u]))u=i;if(u<0)break;done[u]=1;if(E0[u]&&dist[u]+E0[u]<best){best=dist[u]+E0[u];bi=u}for(let v=0;v<n;v++){const w=A[u][v];if(w&&!done[v]&&dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u}}}
  if(bi<0){let m=1e9;for(let i=0;i<n;i++)if(dist[i]<1e9){const dd=NODES[i].distanceTo(to);if(dd<m){m=dd;bi=i}}if(bi<0)return [to]}
  const pts=[to];for(let v=bi;v>=0;v=prev[v])pts.unshift(NODES[v].clone());return pts}
function goTo(v,then){if(!v)return;const t=V(v.x,0,v.z);P.auto={pts:route(P.pos.clone().setY(0),t),then};$('#btns').classList.remove('open')}

    U.dlg.innerHTML=`<div class="mas">🐧</div><span class="skipAll">${T.skipAsk?'再按一次確定跳過':'跳過教學'}</span><div class="cnt">新手教學 ${T.i+1} / ${T.steps.length}</div><div>${txt}</div><div class="bt">${stuck?'<button class="sk" data-b="sk">略過這一步</button>':''}${s.go&&!ask&&!intr&&(!s.el||!(R&&R.el))?'<button class="go" data-b="go">🚶 帶我去</button>':''}${s.ff&&!T.ff&&!ask&&!intr?'<button class="go" data-b="ff">⏩ 快轉時間</button>':''}${s.next&&!ask&&!intr?`<button data-b="nx">${s.last?'🎉 完成':'下一步 ▶'}</button>`:''}</div>`;
    U.dlg.querySelectorAll('button').forEach(b=>b.onclick=()=>{SFX.click();const k=b.dataset.b;if(k==='go')goTo(s.go());else if(k==='ff'){T.ff=1;T.dk=''}else if(k==='sk')tutGo(T.i+1);else if(k==='nx'){if(s.onNext)s.onNext();if(s.last)tutEnd(true);else tutGo(T.i+1)}});
    U.dlg.querySelector('.skipAll').onclick=()=>{if(!T.skipAsk){T.skipAsk=1;T.dk='';setTimeout(()=>{if(TUT2===T){T.skipAsk=0;T.dk=''}},3000)}else tutEnd(false)}}}

// 「☰ 更多」裡的重看教學
{const b=document.createElement('button');b.className='hb o more';b.id='bTut';b.textContent='📘 重看教學';$('#btns').appendChild(b);b.onclick=()=>{SFX.click();$('#btns').classList.remove('open');if(FS)fsClose();try{localStorage.removeItem(TUT_KEY)}catch(e){}tutStart(true)}}

@media (min-width:701px){#bSell.sellFab{font-size:22px;padding:16px 24px;bottom:96px}}`;document.head.appendChild(st)}
window.__T=()=>TUT2;window.__TG=i=>tutGo(i);window.__FS=()=>FS;
