function buildWall(o){const g=new THREE.Group();const B=new Batch();const L=o.len,h=o.h||4.5,t=o.thick||1.2;const wm=mat((WALLS[o.wall]||WALLS.stone).t,o.wallC||0xd8d0c4);

  if(o.walk){B.add(boxG(L,.15,1.2),mat('wood',0x8a6a4a),mxAt(0,h-.5,-t/2-.6));for(let k=0;k<=Math.floor(L/2);k++)B.add(boxG(.15,h-.5,.15),mat('wood',0x6a4a2a),mxAt(-L/2+k*2,(h-.5)/2,-t/2-1.1))}

const WT=.3;// 牆厚
function holeWall(B,wm,W,Hh,holes,T){// 在牆上挖洞（門窗）
  const xs=[-W/2,W/2];holes.forEach(h=>{xs.push(h.x-h.w/2,h.x+h.w/2)});xs.sort((a,b)=>a-b);

    if(!hit){B.add(boxG(b-a,Hh,T||WT),wm,mxAt(cx,Hh/2,0));continue}

function obstBuild(){OBST=new Map();const put=(x,z,r,item)=>{const i0=Math.floor((x-r)/OC),i1=Math.floor((x+r)/OC),j0=Math.floor((z-r)/OC),j1=Math.floor((z+r)/OC);for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const k=i*1000+j;let a=OBST.get(k);if(!a){a=[];OBST.set(k,a)}a.push(item)}};

const VEH=[];
function vehHome(){let sx=0,sz=0,n=0;S.plots.forEach((v,p)=>{if(v){const c=plotCenter(p);sx+=c.x;sz+=c.z;n++}});return n?{x:sx/n,z:sz/n}:{x:0,z:0}}
function findWater(c){for(let r=20;r<800;r+=20)for(let k=0;k<16;k++){const a=k/16*6.283;const x=c.x+Math.sin(a)*r,z=c.z+Math.cos(a)*r;if(Math.abs(x)<HALF-10&&Math.abs(z)<HALF-10&&hAt(x,z)<WATER_Y-.4)return {x,z}}return null}
function vehTick(dt){S.veh=S.veh||[];while(VEH.length>S.veh.length){const v=VEH.pop();scene.remove(v.g)}
  for(let i=VEH.length;i<S.veh.length;i++){const d=VEHD[S.veh[i].k];if(!d)continue;const g=d.mk();g.traverse(m=>{if(m.isMesh)m.castShadow=true});scene.add(g);const h=vehHome();g.position.set(h.x+rand(-10,10),hAt(h.x,h.z),h.z+rand(-10,10));VEH.push({g,d,k:S.veh[i].k,a:rand(0,6.28),r:rand(25,70),u:Math.random(),seg:null,dir:1,ph:rand(0,100)})}
  const t=performance.now()/1000;const roads=S.objs.filter(o=>o.t==='road'&&(o.k==='road'||o.k==='cobble'||o.k==='brick')&&o.pts.length>1);const home=vehHome();
  for(const v of VEH){const g=v.g,d=v.d;if(g.userData.spin)g.userData.spin.rotation.z+=dt*2;
    if(d.k==='car'){if(roads.length){if(!v.P||!v.road||!OBJM.has(v.road.id)){v.road=roads[Math.floor(Math.random()*roads.length)];v.P=roadPath(v.road);v.s=rand(0,v.P.L);v.dir=Math.random()<.5?1:-1}
        const P=v.P;v.s+=v.dir*(d.sp||12)*dt;if(v.s>P.L||v.s<0){v.dir*=-1;v.s=clamp(v.s,0,P.L);if(Math.random()<.4)v.road=null}let s=v.s,i=1;for(;i<P.pts.length;i++){const L=P.pts[i].distanceTo(P.pts[i-1]);if(s<=L)break;s-=L}i=Math.min(i,P.pts.length-1);const a=P.pts[i-1],b=P.pts[i];const L=Math.max(.01,a.distanceTo(b));const f=clamp(s/L,0,1);const ang=Math.atan2(b.x-a.x,b.z-a.z)+(v.dir<0?Math.PI:0);const off=1.6;
        g.position.set(a.x+(b.x-a.x)*f+Math.cos(ang)*off,0,a.z+(b.z-a.z)*f-Math.sin(ang)*off);g.rotation.y=ang}
      else{v.a+=dt*(d.sp||10)/v.r;g.position.set(home.x+Math.sin(v.a)*v.r,0,home.z+Math.cos(v.a)*v.r);g.rotation.y=v.a+Math.PI/2}g.position.y=Math.max(hAt(g.position.x,g.position.z),WATER_Y)}
    else if(d.k==='heli'){g.userData.rotor.rotation.y+=dt*24;g.userData.trotor.rotation.x+=dt*30;v.a+=dt*.12;const r=v.r+20;g.position.set(home.x+Math.sin(v.a)*r,Math.max(hAt(g.position.x,g.position.z),0)+30+Math.sin(t*.5+v.ph)*6,home.z+Math.cos(v.a)*r);g.rotation.y=v.a+Math.PI/2;g.rotation.z=-.12}
    else if(d.k==='plane'){v.a+=dt*(d.big?.035:.06);const r=d.big?380:200;g.position.set(home.x+Math.sin(v.a)*r,(d.big?150:90)+Math.sin(v.a*3)*10,home.z+Math.cos(v.a)*r);g.rotation.set(0,v.a+Math.PI/2,0);g.rotateZ(-.25)}
    else if(d.k==='balloon'){v.a+=dt*.015;const r=v.r+30;g.position.set(home.x+Math.sin(v.a)*r,60+Math.sin(t*.1+v.ph)*20,home.z+Math.cos(v.a)*r);g.rotation.y=v.a+Math.PI/2}
    else if(d.k==='boat'){if(!v.w){v.w=findWater(home);if(!v.w){g.visible=false;continue}g.position.set(v.w.x,WATER_Y,v.w.z)}g.visible=true;const nx=g.position.x+Math.sin(v.a)*7*dt,nz=g.position.z+Math.cos(v.a)*7*dt;if(hAt(nx,nz)<WATER_Y-.3&&hAt(nx+Math.sin(v.a)*5,nz+Math.cos(v.a)*5)<WATER_Y-.3){g.position.x=nx;g.position.z=nz}else v.a+=dt*2.5+.3;v.a+=Math.sin(t*.3+v.ph)*dt*.2;g.rotation.y=v.a;g.position.y=WATER_Y-.25+Math.sin(t*2)*.05}}}
function vehShopHtml(){const own={};(S.veh||[]).forEach(v=>own[v.k]=(own[v.k]||0)+1);return `<div style="font-size:14px;color:#7a6a4a">買了之後會出現在你的小鎮：車子會在馬路上開、直升機和飛機在天上飛、船在湖上開。（有馬路，車子才會開上馬路）</div>`+Object.entries(VEHD).map(([k,d])=>`<div class="prow"><div class="em">${d.em}</div><div class="tx"><b>${d.n}</b>${own[k]?`（已經有 ${own[k]} 台）`:''}<small>${{car:'在馬路上開',heli:'在小鎮上空繞圈飛',plane:'在高空飛行',balloon:'慢慢飄在天上',boat:'在湖泊、池塘裡開'}[d.k]}</small></div><button class="hb g" data-veh="${k}">買一台<br><small>${money(d.p)}</small></button>${own[k]?`<button class="hb r" data-vsell="${k}">賣掉</button>`:''}</div>`).join('')}
function vehBind(){const P=$('#panel');P.querySelectorAll('[data-veh]').forEach(b=>b.onclick=()=>{const k=b.dataset.veh,d=VEHD[k];if((S.veh||[]).length>=60){toast('交通工具最多 60 台');return}if(!spend(d.p,d.n))return;S.veh=S.veh||[];S.veh.push({k});SFX.cash();toast(`${d.em} 買了一台${d.n}！`);dirty();shopPanel()});
  P.querySelectorAll('[data-vsell]').forEach(b=>b.onclick=()=>{const k=b.dataset.vsell;const i=(S.veh||[]).findIndex(v=>v.k===k);if(i<0)return;S.veh.splice(i,1);const j=VEH.findIndex(v=>v.k===k);if(j>=0){scene.remove(VEH[j].g);VEH.splice(j,1)}if(S.mode!=='free')S.money+=Math.round(VEHD[k].p*.5);SFX.cash();dirty();shopPanel()})}

function partClusters(){const ps=S.objs.filter(o=>o.t==='part'&&!o.sold);const par=ps.map((_,i)=>i);const f=i=>par[i]===i?i:(par[i]=f(par[i]));

function clusterValue(c){let x=0,z=0,x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(const o of c){x+=o.x;z+=o.z;x0=Math.min(x0,o.x);x1=Math.max(x1,o.x);z0=Math.min(z0,o.z);z1=Math.max(z1,o.z)}x/=c.length;z/=c.length;
  const pseudo={t:'house',x,z,w:Math.max(4,x1-x0+2),d:Math.max(4,z1-z0+2),wall:'plaster',floors:1};const v=valueOf(pseudo);const base=v.v/(costOf(pseudo)*1.45||1);const cost=c.reduce((a,o)=>a+costOf(o),0);
  const kinds=new Set(c.map(o=>o.k)).size;return Math.round(cost*1.7*base*(1+Math.min(.4,kinds*.025)))}
