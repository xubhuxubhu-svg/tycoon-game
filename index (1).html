<!DOCTYPE html>
<html lang="zh-Hant">
<head><!--netcap--><script>(function(){if(!/[?&]net=1/.test(location.search))return;var g=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t,o){if(t==="webgl"||t==="webgl2"||t==="experimental-webgl"){o=Object.assign({},o||{},{preserveDrawingBuffer:true})}return g.call(this,t,o)}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120c24">
<title>極速F1：狂飆冠軍</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#120c24;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.hidden{display:none!important}
/* ---------- 抬頭顯示 ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#stats{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));font-size:12.5px;font-weight:800;line-height:1.5;text-shadow:0 1px 2px #000,0 0 3px #000}
#stats .y{color:#ffd23a}
#mini{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(100px + env(safe-area-inset-top));width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #0008;background:#28324a}
#pauseBtn{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));width:34px;height:34px;border-radius:8px;border:none;background:#2a2f45cc;color:#fff;font-weight:900;font-size:13px;pointer-events:auto}
#slowmo{position:absolute;right:calc(52px + env(safe-area-inset-right));top:calc(16px + env(safe-area-inset-top));font-size:12px;font-weight:900;color:#c9a8ff;text-shadow:0 0 6px #8a4dff;opacity:0;transition:opacity .2s}
#msgs{position:absolute;left:0;right:0;top:calc(120px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:4px}
.msg{font-weight:900;font-size:17px;font-style:italic;color:#fff;-webkit-text-stroke:.5px #3a1a6a;text-shadow:0 2px 0 #5b2aa8,0 0 10px #a46bff;animation:pop .35s cubic-bezier(.2,1.6,.4,1),fade 2.1s forwards;white-space:nowrap}
.msg.gold{color:#ffe25a;text-shadow:0 2px 0 #9a5a00,0 0 10px #ffb300}
.msg.red{color:#ff5a5a;text-shadow:0 2px 0 #6a0000,0 0 10px #ff2a2a}
.msg.blue{color:#8fe6ff;text-shadow:0 2px 0 #00507a,0 0 10px #2ac0ff}
.msg.green{color:#7dff8a;text-shadow:0 2px 0 #08621a,0 0 10px #2aff4a}
@keyframes pop{0%{transform:scale(.2) translateY(10px);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#lights{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:9px;padding:9px 14px;border-radius:12px;background:#111;box-shadow:0 4px 14px #000a,inset 0 0 0 3px #333}
#lights i{width:30px;height:30px;border-radius:50%;background:#3a0606;box-shadow:inset 0 3px 6px #000}
#lights i.on{background:radial-gradient(circle at 40% 35%,#ff8a8a,#ff1010 45%,#a00000);box-shadow:0 0 16px #ff2020,0 0 4px #ff6060}
#bigText{position:absolute;left:0;right:0;top:calc(130px + env(safe-area-inset-top));text-align:center;font-size:40px;font-weight:900;font-style:italic;letter-spacing:2px;color:#fff;-webkit-text-stroke:2px #1d1d3a;text-shadow:0 4px 0 #1d1d3a,0 0 18px #0008}
#bigText.go{color:#4dff6a;-webkit-text-stroke:2px #04501a;font-size:58px;animation:pop .4s cubic-bezier(.2,1.8,.4,1)}
#levelName{position:absolute;left:0;right:0;top:calc(186px + env(safe-area-inset-top));text-align:center;font-size:16px;font-weight:900;color:#ffd23a;text-shadow:0 2px 0 #6a3a00,0 0 8px #000}
#speedBox{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);min-width:66px;padding:4px 10px 5px;border-radius:9px;background:#1a1f30dd;text-align:center;box-shadow:0 3px 10px #0008}
#hSpeed{display:block;font-size:26px;font-weight:900;color:#ff3348;line-height:1;font-style:italic}
#speedBox small{display:block;font-size:9px;color:#ccd;font-weight:700}
#hGear{display:block;font-style:normal;font-size:10px;color:#5dff7a;font-weight:900}
#nitroGlow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,transparent 45%,rgba(40,140,255,.35) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
/* ---------- 操作按鈕 ---------- */
#controls{position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none}
#controls button{position:absolute;pointer-events:auto;border:none;color:#fff;font-weight:900;font-family:inherit;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .06s,filter .06s}
#controls button span{font-size:10px;margin-top:2px}
#controls button.down{transform:scale(.92);filter:brightness(1.4)}
#bWheelie{left:calc(12px + env(safe-area-inset-left));bottom:calc(76px + env(safe-area-inset-bottom));width:116px;height:38px;border-radius:9px;background:linear-gradient(#8b3fe0,#5a1ea6);box-shadow:0 3px 0 #33105f,0 0 0 2px #b47aff inset;font-size:16px;flex-direction:row!important;gap:6px}
#bWheelie span{font-size:13px!important;margin:0!important}
#bWheelie.trick{background:linear-gradient(#ff4fd8,#a01a8a);box-shadow:0 0 16px #ff4fd8,0 0 0 2px #ffb0f0 inset;animation:pulse .4s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
#bLeft,#bRight{bottom:calc(14px + env(safe-area-inset-bottom));width:54px;height:50px;border-radius:9px;background:#2b3046;box-shadow:0 3px 0 #141826,0 0 0 2px #4a5070 inset;font-size:18px}
#bLeft{left:calc(12px + env(safe-area-inset-left))}
#bRight{left:calc(74px + env(safe-area-inset-left))}
#bNitro{right:calc(18px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom));width:48px;height:42px;border-radius:9px;background:linear-gradient(#ff8a2a,#c24a00);box-shadow:0 3px 0 #6a2600,0 0 0 2px #ffc07a inset;font-size:17px}
#bNitro.empty{filter:grayscale(1) brightness(.6)}
.pedal{bottom:calc(14px + env(safe-area-inset-bottom));width:62px;height:84px;border-radius:9px;font-size:12px!important;justify-content:flex-end!important;padding-bottom:6px;background:repeating-linear-gradient(90deg,#1b1d27 0 7px,#30344a 7px 10px)!important}
#bBrake{right:calc(88px + env(safe-area-inset-right));box-shadow:0 0 0 2px #ff4a5a,0 3px 0 #000}
#bGas{right:calc(18px + env(safe-area-inset-right));height:96px!important;box-shadow:0 0 0 2px #3dff6a,0 3px 0 #000}
@media (min-aspect-ratio:1/1){#speedBox{bottom:calc(14px + env(safe-area-inset-bottom))}}
@media (max-width:700px){#keyHint{display:none}}
#keyHint{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;color:#fff9;pointer-events:none;white-space:nowrap}
/* ---------- 選單面板 ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,#1b1240cc,#0b0718ee)}
.panel{width:min(380px,94vw);max-height:92vh;overflow:auto;background:linear-gradient(#1d1640,#140f2c);border:3px solid #f5c518;border-radius:16px;padding:18px;box-shadow:0 10px 40px #000c,0 0 24px #f5c51833;text-align:center}
.title{font-size:44px;font-weight:900;font-style:italic;line-height:1;background:linear-gradient(#fff36a,#ff9d00 55%,#ff3b2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a1500) drop-shadow(0 0 12px #ff6a0066);margin:6px 0 2px}
.sub{font-size:20px;font-weight:900;font-style:italic;color:#fff;letter-spacing:6px;margin-bottom:14px;text-shadow:0 2px 0 #c0101a}
.btn{display:block;width:100%;margin:9px 0;padding:13px 10px;border:none;border-radius:12px;font-family:inherit;font-size:18px;font-weight:900;color:#2a1600;background:linear-gradient(#ffe45a,#ffb300);box-shadow:0 4px 0 #9a5a00;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a5a00}
.btn.b2{color:#fff;background:linear-gradient(#5a6aa0,#38426e);box-shadow:0 4px 0 #1c2240}
.btn.b3{color:#fff;background:linear-gradient(#9b4dff,#6a1ed0);box-shadow:0 4px 0 #3a0a7a}
.btn.red{color:#fff;background:linear-gradient(#ff5a5a,#c01a1a);box-shadow:0 4px 0 #600}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.credit{margin-top:12px;font-size:12px;color:#b9b0e0}
.coinTag{display:inline-block;padding:4px 12px;border-radius:20px;background:#0006;color:#ffd23a;font-weight:900;margin-bottom:6px}
h2{margin:0 0 10px;font-size:24px;font-style:italic;color:#ffd23a}
.lv{display:flex;align-items:center;justify-content:space-between;width:100%;margin:6px 0;padding:9px 13px;border-radius:12px;border:none;font-family:inherit;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(90deg,#3b2f7a,#2a2258);box-shadow:0 3px 0 #120c30;cursor:pointer;text-align:left}
.lv small{display:block;font-size:11px;color:#c7bfff;font-weight:700}
.lv.lock{filter:grayscale(1) brightness(.55)}
.lv .st{color:#ffd23a;font-size:15px;white-space:nowrap}
.sw{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sw b{width:40px;height:40px;border-radius:10px;border:3px solid transparent;cursor:pointer;box-shadow:0 3px 0 #0008}
.sw b.sel{border-color:#fff;transform:scale(1.12)}
.upg{display:flex;align-items:center;gap:8px;margin:8px 0;padding:8px 10px;border-radius:10px;background:#0004;text-align:left}
.upg div{flex:1;font-weight:900}
.upg small{display:block;color:#bbb;font-weight:700;font-size:11px}
.bar{display:flex;gap:3px;margin-top:3px}.bar i{width:14px;height:6px;border-radius:2px;background:#444}.bar i.on{background:#5dff7a}
.upg button{border:none;border-radius:8px;padding:8px 10px;font-family:inherit;font-weight:900;background:#ffc21a;color:#2a1600;cursor:pointer;white-space:nowrap}
.upg button:disabled{filter:grayscale(1) brightness(.6)}
input.tx{width:100%;padding:12px;border-radius:10px;border:2px solid #6a5ab0;background:#0b0820;color:#fff;font-size:18px;font-weight:900;font-family:inherit;text-align:center;margin:6px 0;user-select:text;-webkit-user-select:text}
.plist{text-align:left;margin:8px 0}
.plist div{padding:8px 10px;margin:5px 0;border-radius:9px;background:#0005;font-weight:900;display:flex;align-items:center;gap:8px}
.plist i{width:16px;height:16px;border-radius:4px;display:inline-block}
.note{font-size:12px;color:#c7bfff;margin:6px 0}
.err{color:#ff7a7a;font-weight:900;min-height:18px;font-size:14px}
select.tx{width:100%;padding:10px;border-radius:10px;background:#0b0820;color:#fff;font-size:16px;font-weight:900;border:2px solid #6a5ab0;font-family:inherit}
/* 結算 */
#results .panel{border-color:#f5c518;padding-top:6px}
.champ{font-size:44px;font-weight:900;font-style:italic;color:#ffd23a;-webkit-text-stroke:2px #5a2a00;text-shadow:0 4px 0 #5a2a00,0 0 20px #ffb300;animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
.trophy{font-size:64px;line-height:1;animation:bob 1s infinite alternate;filter:drop-shadow(0 0 16px #ffcc00)}
@keyframes bob{to{transform:translateY(-6px) rotate(4deg)}}
.place{font-size:24px;font-weight:900;color:#fff;margin:4px 0}
.rline{font-size:14px;font-weight:800;margin:3px 0;color:#e8e2ff}
.rline.g{color:#7dff8a}.rline.y{color:#ffd23a;font-size:15px}.rline.b{color:#8fe6ff}
.rank{text-align:left;margin:8px 0;font-size:14px}
.rank div{display:flex;justify-content:space-between;padding:5px 9px;border-radius:7px;margin:3px 0;background:#0004;font-weight:800}
.rank div.me{background:#f5c51840;outline:2px solid #f5c518}

/* 製作大亨：手機方向鍵加大、傾斜控制按鈕 */
#controls{height:190px}
#bLeft,#bRight{width:86px;height:78px;border-radius:14px;box-shadow:0 4px 0 #141826,0 0 0 3px #6a72a0 inset;font-size:30px}
#bLeft span,#bRight span{font-size:13px!important}
#bLeft{left:calc(10px + env(safe-area-inset-left))}#bRight{left:calc(104px + env(safe-area-inset-left))}
#bWheelie{left:calc(10px + env(safe-area-inset-left));bottom:calc(100px + env(safe-area-inset-bottom));width:180px}
#bTilt{left:calc(10px + env(safe-area-inset-left));bottom:calc(146px + env(safe-area-inset-bottom));width:124px;height:36px;border-radius:10px;background:#2b3046;box-shadow:0 3px 0 #141826,0 0 0 2px #4a5070 inset;font-size:16px;flex-direction:row!important;gap:4px}
#bTilt span{font-size:13px!important;margin:0!important}
#bTilt.on{background:linear-gradient(#2fbf5a,#1d8a3c);box-shadow:0 3px 0 #0f4f22,0 0 0 2px #8affb0 inset}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="nitroGlow"></div>
<div id="flash"></div>

<div id="hud" class="hidden">
  <div id="stats">
    <div>📍 <span id="hDist">0.0 / 30 公里</span></div>
    <div class="y">🔥 氮氣：<span id="hNitro">100%</span></div>
    <div>🏁 名次：<span id="hPos">6/6</span></div>
    <div class="y">⭐ 分數：<span id="hScore">0</span></div>
    <div class="y">🪙 <span id="hCoins">0</span> <span id="hMag"></span></div>
  </div>
  <canvas id="mini" width="128" height="128"></canvas>
  <button id="pauseBtn">❚❚</button>
  <div id="slowmo">🎬 慢動作</div>
  <div id="lights" class="hidden"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="bigText"></div>
  <div id="levelName"></div>
  <div id="msgs"></div>
  <div id="speedBox"><b id="hSpeed">0</b><small>公里/時</small><i id="hGear">空檔</i></div>
</div>

<div id="controls" class="hidden">
  <button id="bWheelie">🤸<span id="wLabel">翹頭</span></button>
  <button id="bLeft">◀<span>左</span></button>
  <button id="bRight">▶<span>右</span></button>
  <button id="bNitro">🔥<span>氮氣</span></button>
  <button id="bBrake" class="pedal">煞車</button>
  <button id="bGas" class="pedal">油門</button>
</div>
<div id="keyHint" class="hidden">鍵盤：↑油門 ↓煞車 ←→轉向 空白鍵翹頭／特技 Shift氮氣 P暫停</div>

<!-- 主選單 -->
<div id="menu" class="screen">
  <div class="panel">
    <div class="title">極速F1</div>
    <div class="sub">狂飆冠軍</div>
    <div class="coinTag">🪙 <span class="coinNow">0</span></div>
    <button class="btn" id="mSolo">🏁 單人比賽</button>
    <button class="btn b3" id="mOnline">🌐 連線對戰</button>
    <button class="btn b2" id="mGarage">🔧 車庫</button>
    <button class="btn b2" id="mSound">🔊 音效：開</button>
    <button class="btn red hidden" id="mExit">⬅ 返回主遊戲</button>
    <div class="credit">遊戲製作：Eric Hu</div>
  </div>
</div>

<!-- 選關 -->
<div id="levels" class="screen hidden">
  <div class="panel">
    <h2>選擇關卡</h2>
    <div id="lvList"></div>
    <button class="btn b2" data-back="menu">↩ 返回</button>
  </div>
</div>

<!-- 車庫 -->
<div id="garage" class="screen hidden">
  <div class="panel">
    <h2>🔧 車庫</h2>
    <div class="coinTag">🪙 <span class="coinNow">0</span></div>
    <div class="note">選擇車身顏色</div>
    <div class="sw" id="swatches"></div>
    <div id="upgList"></div>
    <button class="btn b2" data-back="menu">↩ 返回</button>
  </div>
</div>

<!-- 連線 -->
<div id="online" class="screen hidden">
  <div class="panel">
    <h2>🌐 連線對戰</h2>
    <div id="onJoin">
      <div class="note">輸入你的名字</div>
      <input class="tx" id="nameIn" maxlength="8" placeholder="車手名字">
      <button class="btn b3" id="oCreate">➕ 建立房間</button>
      <div class="note">或輸入朋友的房間號碼</div>
      <input class="tx" id="codeIn" maxlength="4" inputmode="numeric" placeholder="4 位數房號">
      <button class="btn" id="oJoin">🚪 加入房間</button>
    </div>
    <div id="onLobby" class="hidden">
      <div style="font-size:15px;font-weight:900">房間號碼</div>
      <div style="font-size:42px;font-weight:900;color:#ffd23a;letter-spacing:8px" id="roomCode">----</div>
      <div class="note">手機、電腦輸入同一個號碼就能一起比賽（最多 6 人，空位由電腦補滿）</div>
      <div class="plist" id="plist"></div>
      <div class="note">關卡</div>
      <select class="tx" id="lvSel"></select>
      <button class="btn" id="oStart">🏁 開始比賽</button>
      <div class="note" id="waitHost">等待房主開始比賽…</div>
    </div>
    <div class="err" id="oErr"></div>
    <button class="btn b2" id="oBack">↩ 離開</button>
  </div>
</div>

<!-- 暫停 -->
<div id="pause" class="screen hidden">
  <div class="panel">
    <h2>暫停</h2>
    <button class="btn" id="pResume">▶ 繼續</button>
    <button class="btn b2" id="pRestart">🔄 重新開始</button>
    <button class="btn b2" id="pSound">🔊 音效：開</button>
    <button class="btn red" id="pQuit">🏠 離開比賽</button>
  </div>
</div>

<!-- 結算 -->
<div id="results" class="screen hidden">
