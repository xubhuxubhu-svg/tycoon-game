<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>製作大亨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontcss" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#e6ebef;font-family:"Huninn","jf-openhuninn","PingFang TC","Microsoft JhengHei",sans-serif;touch-action:none;color:#234}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit;cursor:pointer}
/* Ｑ版文字 */
.q{color:#fff;-webkit-text-stroke:.24em #163a6b;paint-order:stroke fill;text-shadow:0 .14em 0 #0d2747}
.qs{-webkit-text-stroke:3px #fff;paint-order:stroke fill}
.hide{display:none!important}
/* 上方列 */
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;background:linear-gradient(#2c66b0,#163a6b);border:3px solid #9ad7f2;border-radius:16px;color:#fff;padding:4px 12px 4px 4px;box-shadow:0 3px 0 #0d2747,0 5px 10px rgba(0,0,0,.2);font-size:16px}
.avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(#ffd56b,#ffad3b);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff}
.chip small{display:block;font-size:12px;color:#ffe27a}
.money{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.cur{display:flex;align-items:center;gap:6px;background:linear-gradient(#2c66b0,#163a6b);border:3px solid #9ad7f2;border-radius:14px;color:#fff;font-size:19px;padding:2px 12px 2px 8px;box-shadow:0 3px 0 #0d2747;min-width:96px;justify-content:flex-end;transition:transform .12s;-webkit-text-stroke:3px #0d2747;paint-order:stroke fill}
.cur .ic{font-size:18px;-webkit-text-stroke:0}
.cur.bump{transform:scale(1.18)}
/* 標題 */
#titleWrap{position:fixed;left:0;right:0;top:calc(66px + 2vh);text-align:center;pointer-events:none;z-index:2}
#title{font-size:clamp(50px,14vw,88px);letter-spacing:.04em;line-height:1.05;display:inline-flex;gap:.02em;position:relative}
#title span{display:inline-block;-webkit-text-stroke:.16em #163a6b;paint-order:stroke fill;text-shadow:0 .1em 0 #0d2747,0 .18em 16px rgba(13,39,71,.35);animation:drop .7s cubic-bezier(.3,1.6,.5,1) both,bob 2.4s ease-in-out infinite}
#title span:nth-child(1){color:#ffcf3f;animation-delay:.1s,1s;rotate:-6deg}
#title span:nth-child(2){color:#ff8a5c;animation-delay:.22s,1.2s;rotate:4deg}
#title span:nth-child(3){color:#5cc8ff;animation-delay:.34s,1.4s;rotate:-3deg}
#title span:nth-child(4){color:#7fe07a;animation-delay:.46s,1.6s;rotate:6deg}
@keyframes drop{0%{transform:translateY(-120px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
.star{position:absolute;font-size:20px;animation:tw 1.6s ease-in-out infinite;color:#fff;text-shadow:0 0 8px #fff7a0;font-style:normal}
@keyframes tw{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1.1) rotate(40deg);opacity:1}}
#slogan{position:relative;display:inline-block;margin-top:6px;min-height:46px;font-size:clamp(17px,4.8vw,24px);white-space:nowrap}
#slogan .w{display:inline-block;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 3px 0 rgba(13,39,71,.25),0 0 14px rgba(255,255,255,.9)}
#slogan .w.in{animation:popc .45s cubic-bezier(.3,1.8,.5,1) both}
#slogan .w.out{animation:outc .3s ease-in both}
@keyframes popc{0%{transform:scale(0) rotate(-30deg) translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@keyframes outc{100%{transform:scale(.2) translateY(-14px);opacity:0}}
.coinb{position:fixed;font-size:22px;pointer-events:none;z-index:2}
/* 下方 */
#bottom{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;z-index:2}
#bottom>*{pointer-events:auto}
.big{border:0;color:#fff;font-size:clamp(21px,5.8vw,26px);padding:11px 0;width:min(78vw,340px);border-radius:30px;letter-spacing:3px;transition:transform .1s;animation:fadeUp .5s both;-webkit-text-stroke:5px rgba(0,0,0,.25);paint-order:stroke fill}
.big:active{transform:translateY(3px)}
.green{background:linear-gradient(#6fdc7e,#3fae50);box-shadow:0 6px 0 #2f8a3d,0 8px 14px rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.4)}
.blue{background:linear-gradient(#5aa8f5,#2f7bd6);box-shadow:0 6px 0 #1f5ea8,0 8px 14px rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.4)}
#bSolo{animation:fadeUp .5s .9s both,pulse 1.6s 1.6s infinite}
#bDuo{animation-delay:1s}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
#icons{display:flex;gap:clamp(5px,1.6vw,10px);flex-wrap:wrap;justify-content:center;margin-top:4px;animation:fadeUp .5s 1.1s both}
.ib{width:clamp(44px,12vw,58px);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;position:relative}
.ib .sq{width:100%;aspect-ratio:1;border-radius:16px;background:linear-gradient(#2c66b0,#163a6b);border:3px solid #9ad7f2;box-shadow:0 4px 0 #0d2747,inset 0 2px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5.6vw,26px);transition:transform .1s}
.ib:active .sq{transform:translateY(3px)}
.ib span{font-size:13px;color:#fff;-webkit-text-stroke:4px #163a6b;paint-order:stroke fill}
.dot{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ff4545;border:2px solid #fff;display:none;animation:pulse .9s infinite}
.dot.on{display:block}
#credit{position:fixed;left:10px;bottom:5px;font-size:11px;color:#6a8396;pointer-events:none;z-index:1}
#saved{position:fixed;right:10px;bottom:5px;font-size:13px;color:#2f8a3d;opacity:0;transition:opacity .4s;z-index:6;pointer-events:none}
#saved.on{opacity:1}
#tapHint{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:#fff;border-radius:14px;padding:5px 11px;font-size:14px;color:#e0692f;box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none;z-index:1;white-space:nowrap}
#tapHint:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.float{position:fixed;font-size:22px;color:#fff;-webkit-text-stroke:5px #2a7a30;paint-order:stroke fill;transform:translate(-50%,-50%);pointer-events:none;z-index:5;white-space:nowrap}
/* 視窗 */
#modal{position:fixed;inset:0;background:rgba(10,30,60,.45);display:none;align-items:center;justify-content:center;z-index:10;pointer-events:auto}
#modal.on{display:flex}
.panel{width:min(94vw,600px);max-height:min(86vh,760px);background:#f6faff;border-radius:24px;border:4px solid #9ad7f2;box-shadow:0 8px 0 #0d2747,0 16px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.ph{background:linear-gradient(#3a78c4,#163a6b);color:#fff;font-size:23px;padding:10px 16px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.ph:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 30%,rgba(255,255,255,.25) 0 6px,transparent 7px),radial-gradient(circle at 70% 70%,rgba(255,255,255,.18) 0 4px,transparent 5px),radial-gradient(circle at 88% 25%,rgba(255,255,255,.2) 0 5px,transparent 6px)}
.ph .t{flex:1;-webkit-text-stroke:5px #0d2747;paint-order:stroke fill;position:relative}
.ph button{width:40px;height:40px;border-radius:14px;border:3px solid #9ad7f2;background:#ff6b6b;color:#fff;font-size:20px;box-shadow:0 3px 0 #b33;position:relative}
.pb{padding:14px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.note{background:#fff8dc;border:3px dashed #f3d26a;color:#8a6200;border-radius:16px;padding:8px 12px;font-size:15px;margin-bottom:12px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sc{background:#fff;border-radius:18px;padding:10px;border:3px solid #dbe8f1;box-shadow:0 4px 0 #c7d7e3;position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .1s}
.sc:active{transform:scale(.97)}
.sc .em{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15),inset 0 -5px 0 rgba(0,0,0,.12)}
.sc .nm{font-size:17px;color:#163a6b}
.sc .ct{font-size:13px;color:#678}
.bar{height:10px;border-radius:6px;background:#e3eaf0;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 1px #d3dee8}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4cd36a,#a6ee8c);width:0;border-radius:6px}
.sc.lock{filter:grayscale(.85);opacity:.7}
.sc .lk{position:absolute;top:8px;right:10px;font-size:20px}
.sc .no{position:absolute;top:8px;right:10px;font-size:13px;color:#9ab}
.back{background:#e3eef6;border:3px solid #c3d8e8;border-radius:14px;padding:5px 12px;color:#21508f;margin-bottom:10px;font-size:15px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.gc{background:#fff;border:3px solid #dbe8f1;border-radius:16px;padding:8px;text-align:center;box-shadow:0 3px 0 #c7d7e3;position:relative}
.gc .e{font-size:34px;line-height:1.2}
.gc .n{font-size:14px;color:#163a6b;min-height:36px;display:flex;align-items:center;justify-content:center}
.gc .s{font-size:12px;color:#9ab}
.gc .idx{position:absolute;left:7px;top:4px;font-size:12px;color:#9ab}
.gc.st-auto{border-color:#7fd68c;background:#effbf1}.gc.st-auto .s{color:#2f8a3d}
.gc.st-open{border-color:#ffc94d;background:#fffbea}.gc.st-open .s{color:#e08a00}
.gc.st-next{border-color:#9ad7f2;background:#eef8ff}.gc.st-next .s{color:#2f7bd6}
.gc.st-soon{opacity:.55}
.opt{background:#fff;border:3px solid #dbe8f1;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 3px 0 #c7d7e3}
.opt h3{margin:0 0 6px;color:#163a6b;font-size:19px;font-weight:normal}
.opt p{margin:0 0 10px;font-size:15px;color:#456;line-height:1.6}
.sbtn{border:0;border-radius:16px;padding:9px 16px;color:#fff;font-size:16px;-webkit-text-stroke:3px rgba(0,0,0,.2);paint-order:stroke fill}
.tag{display:inline-block;font-size:12px;background:#ffb547;color:#fff;border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.split{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0 12px}
.scr{width:96px;height:120px;border-radius:12px;border:3px solid #163a6b;background:#cfe7f3;position:relative;overflow:hidden}
.scr .h{position:absolute;left:0;right:0;top:50%;height:3px;background:#163a6b;transition:opacity .6s}
.scr .p{position:absolute;font-size:22px;transition:all 1.2s ease-in-out}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{background:#fff;border:3px solid #dbe8f1;border-radius:16px;padding:8px 4px;text-align:center;color:#163a6b;position:relative;font-size:15px}
.day .d{font-size:13px;color:#789}
.day .g{font-size:26px}
.day.today{border-color:#ffcf3f;background:#fffbe6;animation:pulse 1.2s infinite}
.day.done{opacity:.55}
.day.done:after{content:"✔";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;color:#3fae50}
.day.d7{grid-column:span 2}
.claim{display:block;margin:14px auto 0;width:220px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:linear-gradient(#fff,#f1f7fc);border:3px solid #cfe1ee;border-radius:18px;padding:10px;text-align:center;position:relative;box-shadow:0 3px 0 #c7d7e3}
.card .e{font-size:38px}
.card .n{color:#163a6b;font-size:17px}
.card .d{font-size:13px;color:#567;min-height:36px;line-height:1.4;margin:3px 0 6px}
.card .own{position:absolute;top:6px;right:8px;background:#163a6b;color:#fff;font-size:12px;border-radius:9px;padding:2px 8px}
.card button{border:0;border-radius:14px;background:linear-gradient(#ffd85a,#f2a91c);box-shadow:0 3px 0 #b9790b;color:#5a3500;padding:6px 14px;font-size:15px}
.card button.use{background:linear-gradient(#6fdc7e,#3fae50);box-shadow:0 3px 0 #2f8a3d;color:#fff}
.card button:disabled{filter:grayscale(1);opacity:.6}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.task{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #dbe8f1;border-radius:16px;padding:10px;margin-bottom:8px}
.task .e{font-size:28px}
.task .m{flex:1}
.task .m b{display:block;color:#163a6b;font-size:16px;font-weight:normal}
.task .m small{color:#789}
.task button{border:0;border-radius:14px;padding:7px 12px;color:#fff;background:#4cb85c;box-shadow:0 3px 0 #2f8a3d;font-size:15px;white-space:nowrap}
.task button:disabled{background:#b8c6d1;box-shadow:0 3px 0 #94a5b2}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:3px solid #c3d8e8;background:#e3eef6;border-radius:14px;padding:7px 0;color:#21508f;font-size:15px}
.tabs button.on{background:#163a6b;color:#fff;border-color:#163a6b}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #dbe8f1;border-radius:14px;padding:8px 12px;margin-bottom:6px;font-size:16px}
.row .r{width:32px;text-align:center;font-size:18px}
.row .nm{flex:1;color:#163a6b}
.row .v{color:#2f8a3d}
.row.me{border-color:#ffcf3f;background:#fffbe6}
.set{display:flex;align-items:center;justify-content:space-between;background:#fff;border:3px solid #dbe8f1;border-radius:14px;padding:10px 14px;margin-bottom:8px;color:#163a6b;font-size:16px}
.tg{width:58px;height:32px;border-radius:16px;background:#b8c6d1;position:relative;border:0;transition:background .2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tg.on{background:#4cb85c}.tg.on:after{left:29px}
.set input{border:3px solid #c3d8e8;border-radius:12px;padding:6px 10px;font-size:16px;font-family:inherit;width:150px;user-select:text;-webkit-user-select:text}
.seg button{border:3px solid #c3d8e8;background:#e3eef6;padding:5px 12px;color:#21508f;font-size:15px}
.seg button:first-child{border-radius:12px 0 0 12px}.seg button:last-child{border-radius:0 12px 12px 0}
.seg button.on{background:#163a6b;color:#fff}
.danger{width:100%;border:0;border-radius:14px;background:#e05050;color:#fff;padding:10px;margin-top:8px;box-shadow:0 3px 0 #a33;font-size:16px}
.txt{font-size:15px;line-height:1.8;color:#345}
.txt h3{color:#163a6b;margin:6px 0 4px;font-size:19px;font-weight:normal}
#toast{position:fixed;left:50%;top:108px;transform:translate(-50%,-20px);background:#fff;border:3px solid #ffd36b;color:#7a4a00;padding:9px 18px;border-radius:18px;font-size:17px;opacity:0;transition:all .3s;box-shadow:0 4px 0 #f0c040,0 6px 12px rgba(0,0,0,.15);z-index:20;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.ing #toast{top:138px}
.gem{position:fixed;left:0;top:0;font-size:24px;z-index:21;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.4,.6,1),opacity .7s}
.conf{position:fixed;width:9px;height:14px;z-index:42;pointer-events:none;top:-20px;border-radius:2px}
#confirm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30}
#confirm .box{background:#fff;padding:20px 24px;border-radius:20px;text-align:center;font-size:18px;color:#234;border:4px solid #9ad7f2}
#confirm button{margin:14px 6px 0;padding:8px 20px;border-radius:12px;border:0;font-size:17px}
/* ============ 遊戲畫面 ============ */
#game{position:fixed;inset:0;pointer-events:none;z-index:4}
#game>*{pointer-events:auto}
#lbls{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;pointer-events:none}
.rl{display:flex;align-items:center;gap:5px;border-radius:14px;padding:3px 10px 3px 6px;font-size:14px;color:#fff;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.18);-webkit-text-stroke:3px rgba(0,0,0,.28);paint-order:stroke fill}
.rl .i{font-size:18px;-webkit-text-stroke:0}
.rl small{font-size:12px;opacity:.95}
.rl.pick{background:linear-gradient(#5fd06f,#36a548)}
.rl.drop{background:linear-gradient(#ffb04a,#f2851c)}
.rl.cash{background:linear-gradient(#ffe066,#f5b800);color:#fff}
.rl.full{background:linear-gradient(#ff7676,#e04444)}
.msign{background:#fff;border:3px solid #163a6b;border-radius:12px;padding:2px 10px;font-size:14px;color:#163a6b;box-shadow:0 3px 0 #163a6b}
.zsign{display:flex;flex-direction:column;align-items:center;gap:2px}
.zsign .nm{font-size:20px;color:#fff;-webkit-text-stroke:5px #163a6b;paint-order:stroke fill;text-shadow:0 3px 0 #0d2747}
.zsign .mt{margin-top:3px;background:#fff3c4;color:#8a5a00;border:2px solid #ffc84a;border-radius:10px;padding:1px 9px;font-size:12px}
#gFloor{align-self:flex-end;background:#fffaf0;border:2px solid #ffc84a;color:#8a5a00;border-radius:12px;padding:1px 10px;font-size:12px;box-shadow:0 2px 0 #e0b040}
#gFloor b{color:#c0392b}
#gCash.warn{animation:cashWarn .7s infinite}@keyframes cashWarn{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 10px #ff3b3b) brightness(1.15);transform:scale(1.08)}}
#gFloor.warn{background:#ffe0e0;border-color:#ff6b6b;animation:cashWarn .7s infinite}
#haltTip{position:fixed;left:50%;top:128px;transform:translateX(-50%);z-index:8;background:linear-gradient(#fff4f4,#ffe0e0);border:3px solid #ff6b6b;border-radius:16px;padding:6px 14px;color:#8a1f1f;font-size:14px;text-align:center;box-shadow:0 4px 0 #e05050;display:none;pointer-events:none;max-width:86vw;animation:haltB 1.2s infinite}@keyframes haltB{50%{transform:translateX(-50%) scale(1.05)}}
.zsign .pg{background:#163a6b;color:#fff;border-radius:10px;padding:1px 9px;font-size:12px;border:2px solid #9ad7f2}
.zsign.lock .nm{-webkit-text-stroke-color:#56687a;text-shadow:none}
.padl{background:linear-gradient(#2c66b0,#163a6b);border:3px solid #9ad7f2;border-radius:14px;color:#fff;padding:4px 10px 8px;text-align:center;font-size:13px;box-shadow:0 3px 0 #0d2747;position:relative;overflow:hidden;min-width:92px}
.padl .c{display:flex;align-items:center;justify-content:center;gap:4px;font-size:15px;color:#ffe066}
.padl .b{position:absolute;left:0;bottom:0;height:5px;background:#4cd36a;width:0}
.bub{background:#fff;border-radius:16px;padding:3px 10px;font-size:16px;color:#333;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;gap:3px;align-items:center;border:3px solid #ffd36b}
#ghud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#ghud>*{pointer-events:auto}
.gbtns{display:flex;gap:7px}
.gbtn{width:44px;height:44px;border-radius:14px;border:3px solid #9ad7f2;background:linear-gradient(#2c66b0,#163a6b);color:#fff;font-size:20px;box-shadow:0 3px 0 #0d2747;position:relative}
.gbtn.off{opacity:.45}
#gmoney{font-size:24px}

function initAudio(){if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return false}
  try{A.ctx=new (window.AudioContext||window.webkitAudioContext)();const c=A.ctx.createDynamicsCompressor();c.connect(A.ctx.destination);A.out=A.ctx.createGain();A.out.gain.value=G.set.sfx?0.8:0;A.out.connect(c);
    const b=A.ctx.createBuffer(1,A.ctx.sampleRate,A.ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;A.noise=b;return true}catch(e){A.ctx=null;return false}}
function tone(f,dur,type='sine',vol=.25,slide=null,delay=0){if(!A.ctx)return;const t=A.ctx.currentTime+delay;const o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(A.out);o.start(t);o.stop(t+dur+0.02)}
function noise(dur,vol,freq,type='bandpass',delay=0,q=1){if(!A.ctx)return;const t=A.ctx.currentTime+delay;const s=A.ctx.createBufferSource();s.buffer=A.noise;const f=A.ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=A.ctx.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(A.out);s.start(t,Math.random()*.5);s.stop(t+dur+0.02)}

function makePerson(scene,parka,trim=0xffffff,pants=0x2a2f3b){
  const g=new THREE.Group();const body=new THREE.Group();g.add(body);
  const torso=mesh(new THREE.CylinderGeometry(.3,.4,.72,16),M(parka));torso.position.y=.66;body.add(torso);
  const hem=mesh(new THREE.TorusGeometry(.39,.06,8,20),M(trim));hem.rotation.x=Math.PI/2;hem.position.y=.32;body.add(hem);
  const zip=mesh(new THREE.BoxGeometry(.05,.6,.04),M(trim));zip.position.set(0,.68,.37);zip.rotation.x=-.13;body.add(zip);
  const hood=mesh(new THREE.SphereGeometry(.37,18,14),M(parka));hood.position.y=1.17;body.add(hood);
  const fur=mesh(new THREE.TorusGeometry(.22,.08,10,20),M(trim));fur.position.set(0,1.15,.25);body.add(fur);
  const face=mesh(new THREE.SphereGeometry(.21,16,12),M(0xf3c9a1));face.scale.set(1,1,.55);face.position.set(0,1.15,.22);body.add(face);
  const eyes=[];for(const s of [-1,1]){const e=mesh(new THREE.SphereGeometry(.035,8,6),M(0x1d1d1d),false);e.position.set(.075*s,1.18,.335);body.add(e);eyes.push(e)}
  for(const s of [-1,1]){const c=mesh(new THREE.SphereGeometry(.035,8,6),M(0xf2a08c),false);c.position.set(.12*s,1.11,.31);c.scale.set(1,.6,.5);body.add(c)}
  const legs=[],arms=[];
  for(const s of [-1,1]){const p=new THREE.Group();p.position.set(.15*s,.32,0);const l=mesh(new THREE.BoxGeometry(.17,.3,.2),M(pants));l.position.y=-.15;const b=mesh(new THREE.BoxGeometry(.2,.12,.28),M(0x1c1f27));b.position.set(0,-.27,.04);p.add(l,b);g.add(p);legs.push(p)}
  for(const s of [-1,1]){const p=new THREE.Group();p.position.set(.36*s,.92,0);const a=mesh(new THREE.CapsuleGeometry(.09,.32,4,8),M(parka));a.position.y=-.2;const mt=mesh(new THREE.SphereGeometry(.1,8,6),M(0x2b2f3a));mt.position.y=-.42;p.add(a,mt);p.rotation.z=.18*s;body.add(p);arms.push(p)}
  const anchor=new THREE.Group();anchor.position.set(0,.82,.5);body.add(anchor);
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.5,20),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.12}));sh.rotation.x=-Math.PI/2;sh.position.y=.04;g.add(sh);
  g.userData={body,legs,arms,anchor,eyes};scene.add(g);return g}
function walkAnim(p,speed,dt,carry,onStep){const u=p.o.userData;p.t=(p.t||0)+dt*speed*2.3;const sw=speed>.2?Math.sin(p.t):0,k=Math.min(1,speed/4);
  u.legs[0].rotation.x=sw*.7*k;u.legs[1].rotation.x=-sw*.7*k;u.body.position.y=Math.abs(Math.cos(p.t))*.07*k;u.body.rotation.z=Math.sin(p.t)*.04*k;
  u.arms.forEach((a,i)=>{a.rotation.x+=((carry?-1.35:(i?sw:-sw)*.6*k)-a.rotation.x)*Math.min(1,dt*12)});
  u.anchor.rotation.x+=((-speed*.02)-u.anchor.rotation.x)*Math.min(1,dt*6);
  const st=Math.floor(p.t/Math.PI);if(speed>.5&&st!==p.ls){p.ls=st;onStep?onStep(p):puff(p.o.position.clone().add(V(0,.08,0)),2,.09)}}

    if(p.m.position.y<.03&&p.grav<-5){p.m.position.y=.03;p.vel.set(p.vel.x*.5,-p.vel.y*.3,p.vel.z*.5)}if(p.spin){p.m.rotation.x+=dt*p.spin;p.m.rotation.y+=dt*p.spin*.7}
    const k=p.life/p.max;p.m.material.opacity=Math.min(1,k*2);if(p.grav>-5)p.m.scale.setScalar(p.size*(1.6-k*.6));if(p.life<=0){p.m.parent&&p.m.parent.remove(p.m);p.m.material.dispose();parts.splice(i,1)}}
  for(let i=shocks.length-1;i>=0;i--){const s=shocks[i];s.t+=dt*1.8;s.m.scale.setScalar(.3+s.t*s.maxR);s.m.material.opacity=1-s.t;if(s.t>=1){s.m.parent&&s.m.parent.remove(s.m);shocks.splice(i,1)}}}

function updateFlights(dt){for(let i=flights.length-1;i>=0;i--){const f=flights[i];f.t+=dt;const k=Math.min(1,f.t/f.dur);const to=typeof f.to==='function'?f.to():f.to;f.m.position.lerpVectors(f.from,to,k);f.m.position.y+=f.h*4*k*(1-k);if(f.m.isMesh&&f.spin){f.m.rotation.x+=dt*f.spin;f.m.rotation.z+=dt*f.spin*.5}
    if(k>=1){flights.splice(i,1);f.done&&f.done(f.m)}}}

function cvDeploy(S,hs){if(!FAC||!hs.length)return;const E=S.c.clone().sub(S.c.clone().setY(0).normalize().multiplyScalar(S.rad+1.3));const path=navFind(FAC.F,E);const far=pathLen(path)>30;
  hs.forEach(h=>{h.conv=true;h.o.visible=false;h.pos.copy(FAC.D);h.stack.length=0});GW.convoys=GW.convoys||[];GW.convoys.push({type:'deploy',S,hs,far,path,E,stage:'open',t:0,k:0});SFX.ding()}
function cvWithdraw(S,hs){if(!FAC||!hs.length)return;hs.forEach(h=>{h.conv=true;h.stack.forEach(m=>m.parent&&m.parent.remove(m));h.stack.length=0;h.incoming=0});const E=S.c.clone().sub(S.c.clone().setY(0).normalize().multiplyScalar(S.rad+1.3));
  const path=navFind(FAC.F,E);const far=pathLen(path)>30;GW.convoys=GW.convoys||[];GW.convoys.push({type:'withdraw',S,hs,far,path,E,stage:far?'open':'gather',t:0,k:0})}
function cvStep(cv,dt){cv.t+=dt;const S=cv.S,F=FAC;const hs=cv.hs;
  const release=h=>{h.conv=false;h.o.visible=true;h.state='toFrom';h.path=null;h.pi=0};
  const removeH=h=>{GW.scene.remove(h.o);const i=GW.helpers.indexOf(h);if(i>=0)GW.helpers.splice(i,1)};
  const spinBots=()=>hs.forEach(h=>{const u=h.o.userData;if(u.props)u.props.forEach(p=>p.rotation.y+=dt*8);if(u.body)u.body.position.y=Math.abs(Math.sin(GW.time*14))*.03});
  if(cv.type==='deploy'){
    if(cv.stage==='open'){F.req++;if(F.open>.95){cv.stage=cv.far?'truckOut':'walk';cv.t=0}return}
    if(!cv.far){ // 近距離：機器人自己從鐵捲門走出去
      if(cv.stage==='walk'){if(cv.t<hs.length*.7+1.2)F.req++;spinBots();let all=true;hs.forEach((h,k)=>{if(cv.t<k*.7){all=false;return}h.o.visible=true;if(!h.wp)h.wp=[F.F.clone(),...navFind(F.F,S.padSpot).slice(1)];if(!moveOn(h.o,h.wp,dt,4.2))all=false;else if(!h.rel){h.rel=1;release(h);puff(h.pos.clone().add(V(0,.4,0)),8,.3)}});if(all){cv.done=true}}return}
    if(cv.stage==='truckOut'){if(!cv.tr){cv.tr=makeAITruck(S.def.awn);cv.tr.position.copy(F.D);cv.tr.rotation.y=Math.atan2(F.F.x-F.D.x,F.F.z-F.D.z);tone(220,.4,'sawtooth',.05,330)}F.req++;truckAnim(cv.tr,dt);
      if(goTo(cv.tr,F.P,dt,3)){cv.tr.rotation.y=lerpA(cv.tr.rotation.y,Math.atan2(F.D.x-F.P.x,F.D.z-F.P.z)+Math.PI,dt*4);cv.tr.userData.doorT=1;if(cv.tr.userData.door>.95){cv.stage='board';cv.t=0}}return}
    if(cv.stage==='board'){F.req++;truckAnim(cv.tr,dt);spinBots();let all=true;const R=rearOf(cv.tr);hs.forEach((h,k)=>{if(h.boarded)return;if(cv.t<k*.8){all=false;return}h.o.visible=true;all=false;if(goTo(h.o,R,dt,3.2)){h.boarded=1;h.o.visible=false;SFX.place()}});if(hs.every(h=>h.boarded)){cv.tr.userData.doorT=0;cv.stage='drive';cv.t=0}return}
    if(cv.stage==='drive'){truckAnim(cv.tr,dt);if(cv.tr.userData.door>.05)return;if(moveOn(cv.tr,cv.path,dt,9)){cv.tr.userData.doorT=1;cv.stage='unload';cv.t=0;tone(660,.15,'sine',.08);tone(880,.15,'sine',.08,null,.15)}return}
    if(cv.stage==='unload'){truckAnim(cv.tr,dt);if(cv.tr.userData.door<.95)return;spinBots();const R=rearOf(cv.tr);let all=true;hs.forEach((h,k)=>{if(h.rel)return;all=false;if(cv.t<k*.8)return;if(!h.out){h.out=1;h.pos.copy(R);h.o.visible=true}if(!h.wp2)h.wp2=[S.padSpot.clone()];if(moveOn(h.o,h.wp2,dt,3.6)){h.rel=1;release(h);puff(h.pos.clone().add(V(0,.4,0)),8,.3)}});
      if(all){cv.tr.userData.doorT=0;cv.stage='back';cv.back=[...cv.path].reverse();cv.back.push(F.P.clone())}return}
    if(cv.stage==='back'){truckAnim(cv.tr,dt);if(moveOn(cv.tr,cv.back,dt,9)){cv.stage='enter'}return}
    if(cv.stage==='enter'){F.req++;truckAnim(cv.tr,dt);if(F.open<.95)return;if(goTo(cv.tr,F.D,dt,3)){GW.scene.remove(cv.tr);cv.done=true}return}}
  else{ // 撤回
    if(!cv.far){if(cv.stage==='gather'){spinBots();let all=true;hs.forEach(h=>{if(h.gone)return;all=false;if(!h.wp)h.wp=[...navFind(h.pos.clone(),F.F),F.D.clone()];const near=h.pos.distanceTo(F.F)<6;if(near)F.req++;if(near&&F.open<.9&&h.o.userData.mv&&h.o.userData.mv.i>=h.wp.length-1)return;if(moveOn(h.o,h.wp,dt,4.2)){h.gone=1;removeH(h)}});if(all)cv.done=true}return}
    if(cv.stage==='open'){F.req++;if(F.open>.95){cv.stage='truckOut';cv.t=0;cv.tr=makeAITruck(S.def.awn);cv.tr.position.copy(F.D);cv.tr.rotation.y=Math.atan2(F.F.x-F.D.x,F.F.z-F.D.z)}return}
    if(cv.stage==='truckOut'){F.req++;truckAnim(cv.tr,dt);if(goTo(cv.tr,F.P,dt,3))cv.stage='drive';return}
    if(cv.stage==='drive'){truckAnim(cv.tr,dt);spinBots();hs.forEach(h=>{if(!h.waitP){h.waitP=1;h.wp=[S.c.clone().sub(S.c.clone().setY(0).normalize().multiplyScalar(S.rad-.5))]}moveOn(h.o,h.wp,dt,3.6)});if(moveOn(cv.tr,cv.path,dt,9)){cv.tr.userData.doorT=1;cv.stage='board';cv.t=0}return}
    if(cv.stage==='board'){truckAnim(cv.tr,dt);if(cv.tr.userData.door<.95)return;spinBots();const R=rearOf(cv.tr);hs.forEach((h,k)=>{if(h.boarded||cv.t<k*.8)return;if(goTo(h.o,R,dt,3.2)){h.boarded=1;removeH(h);SFX.place()}});if(hs.every(h=>h.boarded)){cv.tr.userData.doorT=0;cv.stage='back';cv.back=[...cv.path].reverse();cv.back.push(F.P.clone())}return}
    if(cv.stage==='back'){truckAnim(cv.tr,dt);if(cv.tr.userData.door>.05)return;if(moveOn(cv.tr,cv.back,dt,9))cv.stage='enter';return}
    if(cv.stage==='enter'){F.req++;truckAnim(cv.tr,dt);if(F.open<.95)return;if(goTo(cv.tr,F.D,dt,3)){GW.scene.remove(cv.tr);cv.done=true}return}}}

#vsHost .tag{position:absolute;z-index:4;left:8px;bottom:8px;background:var(--pc);color:#fff;border-radius:12px;padding:2px 10px;font-size:13px;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.2)}#vsHost .vspane.vsmall .tag{display:none}

#vsHost .vspane.vsmall .done{top:28px;font-size:13px}#vsHost .vspane.vsmall .done b{font-size:22px}

const VS_KEYS={ // 電腦同一個鍵盤：1P 左手區、2P 右手區，各自轉成遊戲認得的按鍵
 0:{KeyW:'ArrowUp',KeyS:'ArrowDown',KeyA:'ArrowLeft',KeyD:'ArrowRight',Space:'Space',KeyF:'Space',ShiftLeft:'ShiftLeft',KeyG:'ShiftLeft',KeyV:'KeyV',KeyH:'KeyH',KeyM:'KeyM',KeyQ:'KeyQ',KeyE:'KeyE'},
 1:{ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',Enter:'Space',Numpad0:'Space',Slash:'Space',ShiftRight:'ShiftLeft',Period:'ShiftLeft',NumpadDecimal:'ShiftLeft',Numpad1:'KeyV',Numpad2:'KeyH',Numpad3:'KeyM'}};
const KEYNAME={ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',Space:' ',ShiftLeft:'Shift',KeyV:'v',KeyH:'h',KeyM:'m',KeyQ:'q',KeyE:'e'};
const VS_MUTE={f1:f=>f.contentWindow.postMessage({type:'f1rush:sound',on:false},'*'),army:f=>f.contentWindow.postMessage({type:'mute',value:true},'*'),cube:f=>f.contentWindow.postMessage({target:'cube-puzzle',type:'mute',value:true},'*'),
 zombie:f=>f.contentWindow.postMessage({game:'zombie-defense',cmd:'mute',value:true},'*'),maze:f=>f.contentWindow.postMessage({target:'cute-maze',cmd:'mute',value:true},'*')};
const VS_PORTRAIT={army:1,cube:1,zombie:1};

function vsStart(k,lv,mode,first){const g=VS_GAMES[k];const fee=VS_FEE[mode];if(GW.st.money<fee){SFX.err();toast('💸 現金不夠開局喔！');return}GW.st.money-=fee;flow(-fee,'fun');bump('#gCash');
  VSX={k,g,lv,mode,first,res:[null,null],panes:[],big:0,size:1};$('#vsHost').style.display='block';GW.hideR=true;bgmPause(true);
  if(mode==='duo'&&g.duoLive)vsLoadLive();else vsLoadPanes()}
function vsWho(p){return p?'2P':'1P'}
function vsLoadPanes(){const g=VSX.g,host=$('#vsHost');host.querySelectorAll('.vspane,.keys').forEach(e=>e.remove());$('#vsMask').style.display='none';
  const n=VSX.mode==='duo'?2:1;for(let p=0;p<n;p++){const pane=document.createElement('div');pane.className='vspane';pane.style.setProperty('--pc',p?'#e0507e':'#2f6fd1');
    pane.innerHTML=`<div class="hd"><b>${vsWho(p)}</b><span class="sp">✋ 長按拖曳</span><button data-a="size">大小</button><button data-a="swap">⇄ 換大畫面</button></div><span class="tag">${n>1?vsWho(p):'單人挑戰'}</span><div class="done"></div>`;
    const f=document.createElement('iframe');f.allow='autoplay; fullscreen';f.src=g.dir+g.url(VSX.lv);pane.insertBefore(f,pane.firstChild);host.insertBefore(pane,host.querySelector('.vsbar'));
    const P={p,pane,f,started:false};VSX.panes.push(P);f.onload=()=>vsHook(P);vsDragSetup(P)}
  $('#vsBarT').innerHTML=`${g.em} 第 ${VSX.lv} 關<br>${n>1?'⚔️ 即時對戰':'單人挑戰'}`;$('#vsQuit').textContent=n>1?'結束對戰':'結束這場';$('#vsQuit').style.display='';
  if(n>1){const k=document.createElement('div');k.className='keys';k.innerHTML='📱 手機：各自點自己的畫面　💻 電腦：1P 用 W A S D＋空白鍵／F／G，2P 用方向鍵＋Enter／右 Shift';host.appendChild(k);setTimeout(()=>k.style.opacity=0,9000)}
  vsLayout()}
function vsLayout(){if(!VSX)return;const W=innerWidth,H=innerHeight;VSX.panes.forEach(P=>{const big=P.p===VSX.big||VSX.panes.length===1;P.pane.classList.toggle('vbig',big);P.pane.classList.toggle('vsmall',!big);
  if(big){P.pane.style.cssText=P.pane.style.cssText.replace(/(left|top|width|height):[^;]+;?/g,'');return}
  const sc=[.34,.42,.52][VSX.size];let w,h;if(VS_PORTRAIT[VSX.g.id]){h=Math.min(H*sc*1.25,H*.62);w=Math.min(h*.56,W*.6)}else{w=Math.min(W*sc,W*.6);h=w*(H/W)}h+=28;
  if(P.x===undefined){P.x=W-w-12;P.y=H-h-12}P.x=Math.max(4,Math.min(W-w-4,P.x));P.y=Math.max(4,Math.min(H-h-4,P.y));Object.assign(P.pane.style,{left:P.x+'px',top:P.y+'px',width:w+'px',height:h+'px'})})}
addEventListener('resize',()=>VSX&&VSX.panes&&vsLayout());
function vsDragSetup(P){const hd=P.pane.querySelector('.hd');let t=null,drag=false,sx=0,sy=0,ox=0,oy=0,id=null;
  hd.querySelectorAll('button').forEach(b=>b.onpointerdown=e=>e.stopPropagation());
  hd.querySelector('[data-a="swap"]').onclick=()=>{SFX.click();VSX.big=1-VSX.big;const o=VSX.panes[1-P.p];o.x=P.x;o.y=P.y;vsLayout()};
  hd.querySelector('[data-a="size"]').onclick=()=>{SFX.click();VSX.size=(VSX.size+1)%3;vsLayout()};
  hd.onpointerdown=e=>{id=e.pointerId;sx=e.clientX;sy=e.clientY;ox=P.x;oy=P.y;hd.setPointerCapture(id);t=setTimeout(()=>{drag=true;P.pane.classList.add('dragging');navigator.vibrate&&navigator.vibrate(20)},e.pointerType==='mouse'?0:260)};
  hd.onpointermove=e=>{if(e.pointerId!==id)return;if(!drag){if(Math.hypot(e.clientX-sx,e.clientY-sy)>12&&e.pointerType!=='mouse'){clearTimeout(t)}return}P.x=ox+e.clientX-sx;P.y=oy+e.clientY-sy;vsLayout()};
  hd.onpointerup=hd.onpointercancel=e=>{clearTimeout(t);drag=false;P.pane.classList.remove('dragging');id=null}}
// 每個小遊戲載入後：鍵盤分流、防止失焦暫停、小視窗靜音、開始指定關卡
function vsHook(P){const w=P.f.contentWindow;if(!w)return;const duo=VSX.panes.length>1;
  try{if(duo){const fwd=e=>{if(e.__vs)return;e.stopImmediatePropagation();e.preventDefault();vsRoute(e.type,e.code)};w.addEventListener('keydown',fwd,true);w.addEventListener('keyup',fwd,true);w.addEventListener('blur',e=>e.stopImmediatePropagation(),true)}}catch(e){}
  if(VSX.g.start)setTimeout(()=>vsKickP(P),2500);if(duo&&P.p!==VSX.big)setTimeout(()=>{try{VS_MUTE[VSX.g.id]&&VS_MUTE[VSX.g.id](P.f)}catch(e){}},1500)}
function vsKickP(P){if(!VSX||P.started||!VSX.g.start)return;P.started=true;VSX.g.start(P.f,VSX.lv)}
const vsHeld={};
function vsRoute(type,code){if(!VSX||VSX.panes.length<2)return;for(const p of [0,1]){const out=VS_KEYS[p][code];if(!out)continue;const P=VSX.panes[p];const w=P.f.contentWindow,doc=P.f.contentDocument;if(!w||!doc)continue;
  const ev=new w.KeyboardEvent(type,{key:KEYNAME[out]||out,code:out,bubbles:true,cancelable:true});ev.__vs=1;const kc={ArrowLeft:37,ArrowUp:38,ArrowRight:39,ArrowDown:40,Space:32,ShiftLeft:16}[out];if(kc){Object.defineProperty(ev,'keyCode',{get:()=>kc});Object.defineProperty(ev,'which',{get:()=>kc})}
  (doc.activeElement&&doc.activeElement!==doc.body?doc.activeElement:doc.body||doc).dispatchEvent(ev)}}
addEventListener('keydown',e=>{if(!VSX||!VSX.panes||VSX.panes.length<2)return;if(VS_KEYS[0][e.code]||VS_KEYS[1][e.code]){e.preventDefault();if(!e.repeat)vsRoute('keydown',e.code)}},true);
addEventListener('keyup',e=>{if(!VSX||!VSX.panes||VSX.panes.length<2)return;if(VS_KEYS[0][e.code]||VS_KEYS[1][e.code]){e.preventDefault();vsRoute('keyup',e.code)}},true);

// 冰球雙人：直接用遊戲內建的「雙人同機對戰」，同一張球桌即時對打
function vsLoadLive(){const host=$('#vsHost');host.querySelectorAll('.vspane,.keys').forEach(e=>e.remove());const pane=document.createElement('div');pane.className='vspane vbig';const f=document.createElement('iframe');f.allow='autoplay; fullscreen';f.src=VSX.g.dir+'index.html?embed=1';pane.appendChild(f);host.insertBefore(pane,host.querySelector('.vsbar'));
  VSX.panes=[{p:0,pane,f}];$('#vsMask').style.display='none';$('#vsQuit').textContent='結束對戰';$('#vsQuit').style.display='';$('#vsBarT').innerHTML=`🏒 即時對戰<br><b style="color:#e0507e">1P 紅方（下）</b><br><b style="color:#2f6fd1">2P 藍方（上）</b>`;
  f.onload=()=>{setTimeout(()=>{try{const D=f.contentDocument;const o=D.querySelector('#optWin .opt[data-v="5"]');o&&o.click();D.getElementById('b2P').click()}catch(e){}},600);
    VSX.poll=setInterval(()=>{try{const D=f.contentDocument;const ov=D.getElementById('endOv');if(ov&&!ov.classList.contains('hide')){const t=D.getElementById('endTitle').textContent,s=D.getElementById('endScore').textContent;if(/紅方|藍方/.test(t)){clearInterval(VSX.poll);VSX.poll=null;const red=t.includes('紅');vsFinal(red?0:1,[`紅方　${s}`,`藍方　${s}`])}}}catch(e){}},400)}}

window.addEventListener('message',e=>{if(!VSX||!VSX.panes)return;const P=VSX.panes.find(P=>P.f&&e.source===P.f.contentWindow);if(!P||VSX.g.duoLive&&VSX.mode==='duo')return;const d=e.data||{};
  if(d.type==='ready'||d.event==='ready'||d.type==='f1rush:ready')setTimeout(()=>vsKickP(P),300);
  if(d.event==='pause'&&d.game==='zombie-defense'&&VSX.panes.length>1)P.f.contentWindow.postMessage({game:'zombie-defense',cmd:'resume'},'*');
  const r=VSX.g.ev(d);if(!r)return;if(r.quit&&VSX.panes.length===1){vsBack();return}if(r.quit)vsPaneDone(P,{v:-1,txt:'中途離開'});else if(r.done)vsPaneDone(P,r)});
function vsPaneDone(P,r){if(!VSX||VSX.res[P.p])return;VSX.res[P.p]=r;const dn=P.pane.querySelector('.done');
  if(VSX.panes.length===1){setTimeout(()=>vsSoloEnd(r),1800);return}
  dn.innerHTML=`<b>${r.v>0?'🏁':'😵'}</b>${vsWho(P.p)} ${r.v>0?'完成！':'結束了'}<br>${r.txt}`;dn.style.display='flex';SFX.ding();
  const o=1-P.p;if(VSX.res[o]){clearInterval(VSX.cd);setTimeout(()=>vsCompare(),1500);return}
  let left=45;VSX.cd=setInterval(()=>{left--;$('#vsBarT').innerHTML=`${VSX.g.em} 第 ${VSX.lv} 關<br>⏱️ ${vsWho(o)} 還剩 <b>${left}</b> 秒`;if(left<=0){clearInterval(VSX.cd);vsPaneDone(VSX.panes[o],{v:-1,txt:'時間到，沒完成'})}},1000)}
function vsCompare(){const [a,b]=VSX.res;const w=a.v===b.v?-1:(a.v>b.v?0:1);vsFinal(w,[a.txt,b.txt])}
function vsSoloEnd(r){const m=$('#vsMask');m.innerHTML=`<div class="card"><div class="big">${r.v>0?'🎉':'💪'}</div><div style="font-size:20px">${r.txt}</div><div style="font-size:13px;color:#8a7a5a;margin-top:4px">對戰遊戲只是玩樂，不會發獎金喔</div><div style="display:flex;gap:10px;justify-content:center;margin-top:12px"><button class="ok" id="vsAgain">再玩一場（💵${VS_FEE.solo}）</button><button class="no" id="vsEnd">回遊樂場</button></div></div>`;m.style.display='flex';
  $('#vsAgain').onclick=()=>{const {k,lv}=VSX;vsClose();vsStart(k,lv,'solo',0)};$('#vsEnd').onclick=()=>vsBack()}
$('#vsBack').onclick=()=>{SFX.click();if(!VSX)return;if(VSX.panes.length>1&&!VSX.poll&&!(VSX.res[0]&&VSX.res[1])){ask('對戰還沒結束，確定要回遊樂場嗎？<br><small>這場不算勝負</small>',()=>vsBack());return}vsBack()};
$('#vsQuit').onclick=()=>{SFX.click();if(!VSX)return;if(VSX.poll||VSX.panes.length===1){vsBack();return}
  VSX.panes.forEach(P=>{if(!VSX.res[P.p])VSX.res[P.p]={v:-1,txt:'沒完成'}});clearInterval(VSX.cd);vsCompare()};
function vsFinal(win,txt){const m=$('#vsMask');SFX.fanfare&&SFX.fanfare();if(win>=0)confettiDom(60);clearInterval(VSX.cd);
  m.innerHTML=`<div class="card"><div class="big">${win<0?'🤝':'🏆'}</div><div style="font-size:24px">${win<0?'平手！':`<b style="color:${win?'#e0507e':'#2f6fd1'}">${win?'2P':'1P'}</b> 獲勝！`}</div><div class="res"><div class="${win===0?'win':''}"><b style="color:#2f6fd1">1P</b><br>${txt[0]}</div><div class="${win===1?'win':''}"><b style="color:#e0507e">2P</b><br>${txt[1]}</div></div>
   <div style="display:flex;gap:10px;justify-content:center;margin-top:12px"><button class="ok" id="vsAgain">再戰一場（💵${VS_FEE.duo}）</button><button class="no" id="vsEnd">回遊樂場</button></div></div>`;m.style.display='flex';
  $('#vsAgain').onclick=()=>{const {k,lv,first}=VSX;vsClose();vsStart(k,lv,'duo',first)};$('#vsEnd').onclick=()=>vsBack()}
function vsBack(){vsClose();setTimeout(()=>funPanel(),50)}
function vsClose(){if(!VSX)return;if(VSX.poll)clearInterval(VSX.poll);clearInterval(VSX.cd);$('#vsHost').querySelectorAll('.vspane,.keys').forEach(e=>e.remove());$('#vsHost').style.display='none';$('#vsMask').style.display='none';VSX=null;GW.hideR=false;bgmPause(false)}

/* ======================= 🎵 背景音樂（首頁輕快、地圖輕柔，隨機輪播） ======================= */
const BGM_LIST={
 home:['gr0za-upbeat-upbeat-music-596488','paulyudin-upbeat-upbeat-music-607613','kiravale-upbeat-593651','alex-morgan-upbeat-591314','the_mountain-pop-upbeat-upbeat-pop-576584'],
 game:['nastelbom-background-music-617066','cinematic-soul-background-music-622731','alex-morgan-background-music-545525','paulyudin-background-background-music-574010','nastelbom-background-music-602518','alex-morgan-background-score-neutral-underscore-573937','atlasaudio-background-music-610019']};
const BGM={el:new Audio(),list:null,i:0,paused:false,vol:.35};BGM.el.preload='none';BGM.el.volume=BGM.vol;
BGM.el.addEventListener('ended',()=>bgmNext());BGM.el.addEventListener('error',()=>{});
function bgmOn(){return !!(G&&G.set&&G.set.music!==false)}
function bgmPlay(kind){if(BGM.kind===kind&&!BGM.el.paused)return;BGM.kind=kind;BGM.list=[...BGM_LIST[kind]].sort(()=>Math.random()-.5);BGM.i=0;bgmLoad()}
function bgmLoad(){const n=BGM.list[BGM.i%BGM.list.length];BGM.el.src='music/'+n+'.mp3';if(bgmOn()&&!BGM.paused)BGM.el.play().catch(()=>{})}
function bgmNext(){BGM.i++;bgmLoad()}
function bgmPause(p){BGM.paused=p;if(p)BGM.el.pause();else if(bgmOn())BGM.el.play().catch(()=>{})}
function bgmToggle(v){G.set.music=v;if(v){if(!BGM.list)bgmPlay(mode==='game'?'game':'home');else BGM.el.play().catch(()=>{})}else BGM.el.pause();save(true)}
// 瀏覽器規定要先點一下才能播放音樂
document.addEventListener('pointerdown',()=>{if(bgmOn()&&!BGM.paused&&BGM.el.paused){if(!BGM.list)bgmPlay(mode==='game'?'game':'home');else BGM.el.play().catch(()=>{})}},true);
setInterval(()=>{const want=mode==='game'?'game':'home';if(BGM.list&&BGM.kind!==want&&bgmOn()&&!BGM.paused)bgmPlay(want)},800);
document.addEventListener('visibilitychange',()=>{if(document.hidden)BGM.el.pause();else if(bgmOn()&&!BGM.paused&&BGM.list)BGM.el.play().catch(()=>{})});
</script>
