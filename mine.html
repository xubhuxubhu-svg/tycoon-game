/* ---- 自動走路（繞過建築和林班） ---- */
const inBlk=(x,z,m)=>{for(const [bx,bz,w,d] of BLOCKS)if(Math.abs(x-bx)<w/2+m&&Math.abs(z-bz)<d/2+m)return true;return false};
const NODES=[];for(const x of [-31,-27,-13,1,15,29,38,40.5])for(const z of [-58,-48.2,-35.2,-22.2,-9.2,-7,-3,4.5,9,13,20,24])if(onWalk(x,z)&&!inBlk(x,z,.45))NODES.push(V(x,0,z));
function segOK(a,b){const d=a.distanceTo(b),n=Math.ceil(d/.4);for(let i=1;i<n;i++){const t=i/n,x=a.x+(b.x-a.x)*t,z=a.z+(b.z-a.z)*t;if(!onWalk(x,z)||inBlk(x,z,.3))return false}return true}
let ADJ=null;function adj(){if(ADJ)return ADJ;ADJ=NODES.map((a,i)=>NODES.map((b,j)=>i!==j&&a.distanceTo(b)<30&&segOK(a,b)?a.distanceTo(b):0));return ADJ}
function route(from,to){if(segOK(from,to))return [to];const A=adj(),n=NODES.length;const S0=NODES.map(v=>segOK(from,v)?from.distanceTo(v):0),E0=NODES.map(v=>segOK(v,to)?v.distanceTo(to):0);
  const dist=Array(n).fill(1e9),prev=Array(n).fill(-1),done=Array(n).fill(0);for(let i=0;i<n;i++)if(S0[i])dist[i]=S0[i];let best=1e9,bi=-1;
  for(let k=0;k<n;k++){let u=-1;for(let i=0;i<n;i++)if(!done[i]&&dist[i]<1e9&&(u<0||dist[i]<dist[u]))u=i;if(u<0)break;done[u]=1;if(E0[u]&&dist[u]+E0[u]<best){best=dist[u]+E0[u];bi=u}for(let v=0;v<n;v++){const w=A[u][v];if(w&&!done[v]&&dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u}}}

    row('🧪','生長肥料',`所有林班的樹苗馬上長大一半（現在有 ${Object.keys(S.lots).reduce((a,i)=>a+(lotOK(i)?lotState(i).slots.filter(s=>s.st==='sap').length:0),0)} 棵樹苗）`,bbtn('fert',1,money(fert())))+
    '<h3>🌲 樹種一覽</h3>'+TK.map(t=>{const T=TREES[t];const lk=T.lv>lv;return row(T.em,T.n,lk?`等級 ${T.lv} 解鎖`:`長大要 ${durName(growOf(t))}・一棵砍下 ${T.logs} 根原木・原木今天 ${money(logPrice(t))}/根・木板 ${money(boardPrice(t))}/片`,lk?lockTxt(T.lv):`<b>樹苗 ${money(T.sap)}</b>`,lk?'lock':'')}).join('')}
  else if(k==='tools'){h=`<h2>🪓 工具行</h2><div class="note">好工具砍樹更快，背架讓你一次背更多原木。</div><h3>砍樹工具（現在用：${toolOf().em}${toolOf().n}）</h3>`+
    TOOLS.map(t=>row(t.em,t.n,t.d,S.own[t.id]?(toolOf().id===t.id?'<b style="color:#2fb04a">使用中</b>':'<b>已經有了</b>'):t.lv>lv?lockTxt(t.lv):bbtn('tool',t.id,money(t.p)),S.own[t.id]?'own':t.lv>lv?'lock':'')).join('')+
    `<h3>背架（現在：${packOf().n}，可背 ${packOf().cap} 根）</h3>`+PACKS.filter(p=>p.p).map(t=>row(t.em,t.n,t.d,S.own[t.id]?'<b style="color:#2fb04a">已經有了</b>':t.lv>lv?lockTxt(t.lv):bbtn('tool',t.id,money(t.p)),S.own[t.id]?'own':t.lv>lv?'lock':'')).join('')}

    VEHS.map(v=>{const own=S.vehOwn[v.id];const on=(S.veh||'')===v.id;return row(v.em,v.n,v.id?`${v.d}・速度 ×${v.sp}${v.chop?'・砍樹 ×'+v.chop:''}${v.smoke?'・會冒黑煙':''}`:'用走的，不用保養費',on?'<b style="color:#2fb04a">使用中</b>':own?bbtn('ride',v.id,v.id?'🚗 開這台':'🚶 改用走的','','g'):v.lv>lv?lockTxt(v.lv):bbtn('car',v.id,money(v.p)),on?'own':v.lv>lv&&!own?'lock':'')}).join('')}
  else if(k==='staff'){const lots=Object.keys(S.lots).filter(i=>S.lots[i].own);h=`<h2>👷 人力仲介</h2><div class="note">員工每天領薪水（看「📒 帳本」）。伐木工、植樹員是「一塊林班一個人」，點林班的按鈕雇用或解雇。</div>`+
    STAFF.map(s=>{const lk=s.lv>lv;if(s.per==='lot'){const v=S.staff[s.id]||{};return `<div class="row ${lk?'lock':''}"><div class="em">${s.em}</div><div class="tx"><b>${s.n}</b>（每人每天 ${money(s.wage)}）<small>${s.d}</small>${lk?'':`<div class="chips">${lots.map(i=>`<button data-a="lotstaff" data-v="${s.id}|${i}" class="${v[i]?'on':''}">${v[i]?'✅':'➕'} ${LOTS[i].n.slice(-1)}</button>`).join('')}</div>`}</div>${lk?lockTxt(s.lv):''}</div>`}

function bindShop(k){$('#panel').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,v=b.dataset.v;const re=()=>{if(curShop===k&&panelOn())reopen(k)};
  if(a==='fert'){const n=Object.keys(S.lots).reduce((x,i)=>x+(lotOK(i)?lotState(i).slots.filter(s=>s.st==='sap').length:0),0);if(!n){hint('nosap','🌱 現在沒有樹苗可以施肥');return}confirmAsk(`買 <b>🧪生長肥料</b>？<br>${money(fert())}，${n} 棵樹苗馬上長大一半`,()=>{if(!spend(fert(),'fert'))return;for(const i in S.lots)if(lotOK(i))lotState(i).slots.forEach(s=>{if(s.st==='sap'){s.g+=.5;if(s.g>=1){s.g=1;s.st='tree'}}});for(const i in S.lots)lotSync(i);SFX.plant&&SFX.plant();toast('🧪 施肥完成，樹苗長高了！');re()})}

  else if(a==='ride'){S.veh=v;vehSync();SFX.click();toast(v?`${vehOf().em} 開上 ${vehOf().n}`:'🚶 改用走的');re()}

  else if(a==='fire'){const s=STAFF.find(x=>x.id===v);confirmAsk(`確定要解雇 <b>${s.em}${s.n}</b>？`,()=>{delete S.staff[v];npcSync();re()})}
  else if(a==='lotstaff'){const [id,i]=v.split('|');const s=STAFF.find(x=>x.id===id);S.staff[id]=S.staff[id]||{};if(S.staff[id][i]){confirmAsk(`解雇 ${LOTS[i].n} 的 <b>${s.em}${s.n}</b>？`,()=>{delete S.staff[id][i];npcSync();re()})}else confirmAsk(`在 <b>${LOTS[i].n}</b> 雇用 ${s.em}${s.n}？<br>每天薪水 ${money(s.wage)}`,()=>{S.staff[id][i]=1;npcSync();toast(`${s.em} ${s.n}到 ${LOTS[i].n} 上班了`);SFX.ding&&SFX.ding();tutDo('hire');re()})}
  else if(a==='mach'){const m=MACH.find(x=>x.id===v);confirmAsk(`買 <b>${m.em}${m.n}</b>？<br>${money(m.p)}`,()=>{if(!spend(m.p,'machine'))return;S.mach[v]=1;toast(`✅ ${m.em}${m.n} 裝好了`);re()})}
  else if(a==='lot'){buyLot(+v,re)}

/* ---- 林務所：租林班 ---- */

function officePanel(){curShop='office';const lv=woodLv();const eco=Math.round(S.eco==null?60:S.eco);
  openPanel(`<h2>🌲 林務所</h2><div class="big3">🌿 森林永續值：<b style="color:${eco>=50?'#2fb04a':eco>=25?'#e8701a':'#c0392b'}">${eco}</b> / 100</div><div class="bar"><i style="width:${eco}%"></i></div><div class="note">砍樹會讓永續值下降，種回去會上升。永續值越高，原木、作品賣得越貴（最多 +20%）；低於 25 的話山坡可能發生土石流！</div><h3>林班</h3>`+
    LOTS.map(L=>{const st=S.lots[L.i];const own=st&&st.own;return row('🌲',L.n,own?(S.slide[L.i]?'⛰️ 被土石蓋住了，要整地':`租用中・每天租金 ${money(L.rent)}・樹 ${lotState(L.i).slots.filter(s=>s.st==='tree').length} 棵、樹苗 ${lotState(L.i).slots.filter(s=>s.st==='sap').length} 棵`):L.lv>lv?`等級 ${L.lv} 可以租`:`租金 ${money(L.p)}，之後每天 ${money(L.rent)}`,own?bbtn('gotoLot',L.i,'🚶 過去','','g'):L.lv>lv?lockTxt(L.lv):bbtn('lot',L.i,money(L.p)),own?'own':L.lv>lv?'lock':'')}).join('')+'<h3>森林設施</h3>'+machRows(['sprinkler','flume']),()=>bindShop('office'))}

const slotEm=s=>s.st==='tree'?TREES[s.k].em:s.st==='sap'?'🌱':s.st==='stump'?'🪵':s.st==='burn'?'⬛':'🟫';
function replantCost(i){const L=lotState(i);let n=0,c=0,f=S.freeSap||0;const k=L.auto;L.slots.forEach(s=>{if(s.st!=='tree'&&s.st!=='sap'){n++;if(f>0)f--;else c+=TREES[k].sap}});return {n,c}}

   <div class="grid12">${sl.slots.map(s=>`<div>${slotEm(s)}<small>${s.st==='tree'?'可以砍':s.st==='sap'?Math.floor(s.g*100)+'%':s.st==='stump'?'樹頭':s.st==='burn'?'燒掉了':'空地'}</small>${s.st==='sap'?`<small>${realAt(growOf(s.k)*(1-s.g))}</small>`:''}</div>`).join('')}</div>
   <div class="note">走進林班，走到成熟的樹旁邊站著就會砍（${ripe} 棵可以砍），原木會背在身上。${st.pile?`林班旁邊堆了 <b>${st.pile}</b> 根原木，走過去就會撿起來。`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"><button class="pbtn o" id="gch" ${ripe?'':'disabled'}>🪓 走去砍樹</button>${st.pile?'<button class="pbtn" id="gpl">🪵 去撿原木堆</button>':''}</div>
   <h3>要種哪一種樹</h3><div class="chips">${TK.map(k=>`<button data-k="${k}" class="${sl.auto===k?'on':''}" ${TREES[k].lv>lv?'disabled':''}>${TREES[k].em}${TREES[k].n}${TREES[k].lv>lv?' 🔒'+TREES[k].lv:''}</button>`).join('')}</div>
   <div class="note">${TREES[sl.auto].n}：長大 ${durName(growOf(sl.auto))}、樹苗 ${money(TREES[sl.auto].sap)}、原木今天 ${money(logPrice(sl.auto))}/根</div>

    $('#gch').onclick=()=>{closePanel();if(!goChop(i))hint('notree','🌲 現在沒有成熟的樹可以砍')};{const gp=$('#gpl');if(gp)gp.onclick=()=>{closePanel();const pp=LOTV[i].pile.position;goTo(V(pp.x,0,pp.z+.6))}}

      else if(a==='sellb')b.onclick=()=>{const n=S.wh[v];const val=sellBoards(v,n);SFX.cash();toast(`💵 賣了 ${TREES[v].n}木板 ×${n}，得到 ${money(val)}`);sawPanel()};else if(a==='selld')b.onclick=()=>{const v2=S.saw.dust*3+S.saw.coal*14;S.saw.dust=0;S.saw.coal=0;earn(v2,'coal');SFX.cash();toast(`💵 賣了木屑、木炭，得到 ${money(v2)}`);sawPanel()}})})}
